.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}

  <div class="row"><span class="lead">自分の言葉</span><select id="mine"></select></div>
  <div class="row" id="targets"></div>
  <div class="ask"><input id="q" placeholder="例：お会計お願いします" enterkeyhint="go" autocomplete="off"><button class="btn main" id="mic">🎤</button></div>

  <div id="out" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="row" id="packs"></div>

  <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>

  "ru_RU-irina-medium": "ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx",
  "en_US-hfc_female-medium": "en/en_US/hfc_female/medium/en_US-hfc_female-medium.onnx",
  "zh_CN-huayan-medium": "zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx",
  "en_US-hfc_male-medium": "en/en_US/hfc_male/medium/en_US-hfc_male-medium.onnx",

const sessions = {}, configs = {};

// How to say something in this language with this gender: a phone voice, or a downloaded one

    const finish = () => { if (finished) return; finished = true; clearTimeout(timer); if (rec === r) { rec = null; recDone = null; }
      if (!best.length && Ears.SERIOUS.includes(err)) { Ears.markAI(lang); return resolve(Ears.aiOnce(lang, long)); }
      resolve({ alts: best, err }); };
    const r = new SR(); rec = r; recDone = v => { best = v.alts.length ? v.alts : best; err = v.err; finish(); };
    r.lang = LANG[lang].sr; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    r.onresult = e => { best = [...e.results[0]].map(x => x.transcript); };
    r.onerror = e => { if (e.error !== "no-speech" && e.error !== "aborted") err = e.error; };
    r.onend = finish;
    timer = setTimeout(() => { try { r.stop(); } catch {} setTimeout(finish, 1200); }, long ? 25000 : 12000);
    try { r.start(); } catch { err = "start"; finish(); }
  });
}
function stopListening() { Ears.stopAI(); if (rec) { const r = rec; try { r.stop(); } catch {} setTimeout(() => { if (rec === r) recDone?.({ alts: [], err: null }); }, 1500); } }
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) e[k] = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v); } for (const c of kids) if (c != null && c !== "") e.append(c); return e; };

/* ---------- Words: anything you want to learn, instantly in every language ---------- */
const ALL = ["ja", "en", "ka", "ru", "ko", "zh"];
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let mine = load("t4w-mine", (navigator.language || "ja").slice(0, 2)); if (!LANG[mine]) mine = "ja";
let targets = load("t4w-targets", ["en", "ka", "ru", "ja"].filter(l => l !== mine).slice(0, 3));
let words = load("t4w-words", []);
for (const k of ALL) $("mine").add(new Option(LANG[k].name, k)); $("mine").value = mine;
$("mine").onchange = () => { mine = $("mine").value; targets = targets.filter(t => t !== mine); keep("t4w-mine", mine); keep("t4w-targets", targets); chips(); run(true); packs(); };
function chips() {
  const box = $("targets"); box.innerHTML = '<span class="lead">覚えたい言葉</span>';
  for (const k of ALL) { if (k === mine) continue;
    const b = h("button", { class: "chip", "aria-pressed": String(targets.includes(k)) }, LANG[k].name);
    b.onclick = () => { targets = targets.includes(k) ? targets.filter(x => x !== k) : [...targets, k]; keep("t4w-targets", targets); chips(); run(true); warmFor(targets); packs(); };
    box.append(b); }
}

// Free: 10 new phrases a day and 30 words in the list. A Talk4 Class plan (unlock code) removes the limits.
const FREE_DAY = 10, FREE_WORDS = 30;
const paid = () => { try { return (localStorage.getItem("t4c-tier") || "none") !== "none"; } catch { return false; } };
function allowLookup(text) {
  if (paid()) return true;
  const day = new Date().toISOString().slice(0, 10), u = load("t4w-use", {});
  if (u.day !== day) { u.day = day; u.list = []; }
  if (u.list.includes(text)) return true;
  // typing is checked as you go: only count a phrase once it is finished (Enter / pause), and ignore growing prefixes
  u.list = u.list.filter(x => !text.startsWith(x));
  if (u.list.length >= FREE_DAY) return false;
  u.list.push(text); keep("t4w-use", u);
  const left = FREE_DAY - u.list.length; st(left <= 3 ? `無料はあと${left}回（今日）` : "");
  return true;
}
function paywallCard(words) {
  return h("div", { class: "card" },
    h("div", { class: "t" }, words ? `🔒 無料の単語帳は${FREE_WORDS}個まで` : `🔒 今日の無料分（${FREE_DAY}回）を使い切りました`),
    h("div", { class: "lead" }, "有料プランなら回数も単語帳も無制限。教室のレッスン・交流会とセットで使えます。明日になるとまた無料で使えます。"),
    h("div", { class: "acts" }, h("a", { class: "btn main", href: "class.html?plans=1", style: "text-decoration:none" }, "💳 プランを見る・解除コード")));
}
const memo = load("t4w-cache", {});
async function tr(text, from, to) {
  const key = from + ">" + to + ":" + text; if (memo[key]) return memo[key];
  const r = await translate(text, from, to); memo[key] = { text: r.text, rom: r.rom };
  const ks = Object.keys(memo); if (ks.length > 400) delete memo[ks[0]]; keep("t4w-cache", memo); return memo[key];
}
let job = 0, timer = null, lastQ = "";
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(run, 600); };
$("q").onkeydown = e => { if (e.key === "Enter") { clearTimeout(timer); run(true); $("q").blur(); } };
async function run(force) {
  const text = $("q").value.trim(); if (!text) { $("out").innerHTML = ""; lastQ = ""; return; }
  if (text === lastQ && !force) return; lastQ = text;
  const my = ++job; $("out").innerHTML = "";
  if (!allowLookup(text)) { $("out").append(paywallCard()); return; }
  const cards = targets.map(to => { const c = h("div", { class: "card" }, h("div", { class: "lg" }, LANG[to].name), h("div", { class: "t" }, "…"), h("div", { class: "r" }), h("div", { class: "acts" })); $("out").append(c); return [to, c]; });
  // 1) Instant machine translation  2) the AI's natural, real-life phrasing replaces it a moment later
  const ai = aiPhrases(text, targets);
  await Promise.all(cards.map(async ([to, c]) => {
    try { const r = await tr(text, mine, to); if (my !== job) return; if (!c.dataset.ai) fill(c, text, to, r); }
    catch { if (my === job && !c.dataset.ai) c.children[1].textContent = "⚠ 電波を確認してください"; }
  }));
  const better = await ai; if (my !== job || !better) return;
  for (const [to, c] of cards) { const b = better[to]; if (!b?.text) continue;
    const g = memo[mine + ">" + to + ":" + text];
    c.dataset.ai = "1"; fill(c, text, to, { text: b.text, rom: to === "en" ? "" : to === "ka" ? kaRoman(b.text) : to === "ru" ? translit(b.text, RU) : (b.rom || "") });
    c.children[0].textContent = LANG[to].name + "  ✓ 自然な言い方" + (g && g.text.replace(/[.!?。]$/, "") !== b.text.replace(/[.!?。]$/, "") ? "（直訳: " + g.text + "）" : ""); }
}
const RU = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"'","э":"e","ю":"yu","я":"ya"};
const translit = (t, map) => [...t].map(c => { const lo = c.toLowerCase(), r = map[lo]; if (r == null) return c; return c !== lo && r ? r[0].toUpperCase() + r.slice(1) : r; }).join("");
let AIcfg = null; const aiReady = import("./config.js").then(m => AIcfg = m.AI).catch(() => {});
const aiMemo = load("t4w-ai", {});
async function aiPhrases(text, langs) {
  const key = mine + ":" + langs.join(",") + ":" + text; if (aiMemo[key]) return aiMemo[key];
  await aiReady; if (!AIcfg?.proxy) return null;
  const NAMES = { ja: "Japanese", en: "English", ka: "Georgian", ru: "Russian", ko: "Korean", zh: "Simplified Chinese" };
  const shape = "{" + langs.map(l => `"${l}":{"text":"","rom":""}`).join(",") + "}";
  const prompt = `A ${NAMES[mine]} speaker living in Tbilisi wants to learn how to say this in real life (shop, restaurant, taxi, daily talk): "${text}". For each language give what a native speaker would actually say — short, natural, polite everyday phrasing with correct grammar, not a word-for-word translation. ${Names.namesPrompt(langs, text)} "rom" = reading in Latin letters (empty for English). Reply ONLY JSON ${shape} with keys: ${langs.map(l => l + "=" + NAMES[l]).join(", ")}.`;
  try {
    const r = await fetch(AIcfg.proxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ request: { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.2, thinkingConfig: { thinkingLevel: "minimal" } } } }) });
    const j = await r.json(), raw = j.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
    const o = JSON.parse(raw.replace(/^```json|```$/g, "").trim());
    aiMemo[key] = o; const ks = Object.keys(aiMemo); if (ks.length > 300) delete aiMemo[ks[0]]; keep("t4w-ai", aiMemo);
    return o;
  } catch { return null; }
}
function fill(c, text, to, r) {
  c.children[1].textContent = r.text; c.children[2].textContent = r.rom || "";
  const acts = c.children[3]; acts.innerHTML = "";
  const stars = h("span", { class: "stars" });
  const saved = () => words.some(w => w.a === text && w.lang === to);
  const star = h("button", { class: "btn" + (saved() ? " on" : "") }, saved() ? "⭐ 保存済み" : "⭐ 保存");
  star.onclick = () => { if (saved()) return; if (!paid() && words.length >= FREE_WORDS) { $("out").prepend(paywallCard(true)); return; } words.unshift({ a: text, mine, lang: to, t: r.text, rom: r.rom || "", n: 0, at: Date.now() }); keep("t4w-words", words); star.className = "btn on"; star.textContent = "⭐ 保存済み"; list(); };
  const check = h("button", { class: "btn" }, "🎤 言ってみる");
  check.onclick = async () => { if (Ears.busy()) { Ears.stopAI(); return; } unlockAudio(); check.textContent = "👂 …"; const res = await listenOnce(to); check.textContent = "🎤 言ってみる";
    const s = Math.max(0, ...res.alts.map(x => scoreOf(r.text, x, to))), n = starsFor(s);
    stars.textContent = res.alts.length ? "★".repeat(n) + "☆".repeat(3 - n) + "  " + res.alts[0] : (res.err === "nosr" ? "この端末は音声入力に未対応" : "聞こえませんでした"); };
  const play = h("button", { class: "btn" }, "🔊"); play.onclick = () => { unlockAudio(); say(r.text, to); };
  const slow = h("button", { class: "btn" }, "🐢"); slow.onclick = () => { unlockAudio(); say(r.text, to, true); };
  acts.append(play, slow, check, star, stars);
}
$("mic").onclick = async () => {
  if (Ears.busy()) { Ears.stopAI(); return; }
  unlockAudio(); $("mic").classList.add("on"); $("mic").textContent = "👂";
  const res = await listenOnce(mine); $("mic").classList.remove("on"); $("mic").textContent = "🎤";
  if (res.alts[0]) { $("q").value = res.alts[0]; run(true); } else st(res.err === "nosr" ? "この端末は音声入力に未対応です。文字で入れてください" : "聞こえませんでした。もう一度どうぞ");
};
function list() {
  $("count").textContent = (words.length ? `${words.length}  ` : "") + streakText(); const box = $("list"); box.innerHTML = "";
  if (!words.length) { box.append(h("p", { class: "lead" }, "まだありません。訳の下の ⭐ を押すとここに入ります。")); return; }
  words.forEach((w, i) => {
    const play = h("button", { "aria-label": "play" }, "🔊"); play.onclick = () => { unlockAudio(); say(w.t, w.lang); };
    const del = h("button", { "aria-label": "delete" }, "✕"); del.onclick = () => { words.splice(i, 1); keep("t4w-words", words); list(); };
    const b = h("div", { class: "b" }, w.a + "  ·  " + LANG[w.lang].name + "  "); if (w.rom) b.append(h("i", {}, w.rom));
    box.append(h("div", { class: "word" }, h("div", { class: "m" }, h("div", { class: "a" }, w.t), b), play, del));
  });
}
// Daily streak: practise at least once a day (test ⭕/❌) to keep the 🔥 going
const dayStr = d => { const x = new Date(d); return x.getFullYear() + "-" + (x.getMonth() + 1) + "-" + x.getDate(); };
function practised() {
  const s = load("t4w-streak", { day: "", n: 0, today: 0 }), today = dayStr(Date.now()), yest = dayStr(Date.now() - 864e5);
  if (s.day !== today) { s.n = s.day === yest ? s.n + 1 : 1; s.today = 0; s.day = today; }
  s.today++; keep("t4w-streak", s); return s;
}
function streakText() {
  const s = load("t4w-streak", { day: "", n: 0, today: 0 }), today = dayStr(Date.now()), yest = dayStr(Date.now() - 864e5);
  if (s.day === today) return `🔥 ${s.n}日連続 · 今日${s.today}問`;
  if (s.day === yest && s.n) return `🔥 ${s.n}日連続 — 今日も1問で続きます`;
  return "";
}
// Flashcards: your words first, the answer after a tap; ones you miss come back sooner
let qi = 0;
$("quizBtn").onclick = () => { if (!words.length) { st("先に ⭐ で言葉を保存してください"); return; } $("quiz").hidden = !$("quiz").hidden; if (!$("quiz").hidden) { words.sort((x, y) => x.n - y.n); qi = 0; card(); } };
function card() {
  const w = words[qi % words.length], Q = $("quiz"); Q.innerHTML = "";
  const ans = h("div", { hidden: "" }, h("div", { class: "ans" }, w.t), h("div", { class: "r", style: "color:var(--gold)" }, w.rom));
  const show = h("button", { class: "btn main" }, "👀 答えを見る");
  const good = h("button", { class: "btn", hidden: "" }, "⭕ 言えた"), bad = h("button", { class: "btn", hidden: "" }, "❌ もう一度");
  show.onclick = () => { unlockAudio(); ans.hidden = false; show.hidden = true; good.hidden = bad.hidden = false; say(w.t, w.lang); };
  good.onclick = () => { practised(); w.n++; keep("t4w-words", words); qi++; card(); };
  bad.onclick = () => { practised(); w.n = Math.max(0, w.n - 1); keep("t4w-words", words); words.splice(qi % words.length, 1); words.splice(Math.min(words.length, (qi % (words.length + 1)) + 2), 0, w); qi++; card(); };
  $("count").textContent = (words.length ? words.length + "  " : "") + streakText();
  Q.append(h("div", { class: "lead" }, `${(qi % words.length) + 1} / ${words.length} · ${LANG[w.lang].name}で言うと？`), h("div", { class: "q" }, w.a), ans, h("div", { class: "row", style: "justify-content:center" }, show, good, bad));
}

/* ---------- Word packs ---------- */
const { PACKS } = await import("./packs.js?v=" + Math.floor(Date.now() / 600000));
const FREE_PACKS = ["food", "numbers"];
let openPack = null;
const readOf = (wd, lang) => lang === "ja" ? wd.jr : lang === "ko" ? wd.kr : lang === "zh" ? wd.zr : lang === "ru" ? translit(wd.ru, RU) : lang === "ka" ? kaRoman(wd.ka) : "";
function packs() {
  const box = $("packs"); box.innerHTML = "";
  for (const P of PACKS) {
    const locked = !paid() && !FREE_PACKS.includes(P.id);
    const b = h("button", { class: "chip" + (openPack === P.id ? " cur" : "") }, `${P.icon} ${P.name[mine] || P.name.en}${locked ? " 🔒" : ""}`);
    b.onclick = () => { openPack = openPack === P.id ? null : P.id; packs(); };
    box.append(b);
  }
  const out = $("pack"); out.innerHTML = ""; if (!openPack) return;
  const P = PACKS.find(x => x.id === openPack);
  if (!paid() && !FREE_PACKS.includes(P.id)) { out.append(paywallCard()); return; }
  const langs = targets.length ? targets : ["en"];
  const all = h("button", { class: "btn main" }, `⭐ ${P.words.length}語を単語帳に入れる`);
  all.onclick = () => {
    let n = 0, full = false;
    for (const wd of P.words) for (const L of langs) if (!words.some(x => x.t === wd[L] && x.lang === L)) {
      if (!paid() && words.length >= FREE_WORDS) { full = true; break; }   // free plan: same 30-word cap as ⭐
      words.unshift({ a: wd[mine] || wd.en, mine, lang: L, t: wd[L], rom: readOf(wd, L) || "", n: 0, at: Date.now() }); n++; }
    keep("t4w-words", words); list(); all.textContent = `⭐ ${n}語を入れました`;
    if (full) out.prepend(paywallCard(true));
  };
  out.append(h("div", { class: "row" }, all));
  for (const wd of P.words) {
    const row = h("div", { class: "word" }, h("div", { class: "m" }, h("div", { class: "a" }, wd[mine] || wd.en)));
    for (const L of langs) {
      const btn = h("button", { title: LANG[L].name, style: "font-size:15px;text-align:left" }, wd[L]);
      const r = readOf(wd, L); if (r && r !== wd[L]) btn.append(h("div", { style: "font-size:12px;color:var(--gold)" }, r));
      btn.onclick = () => { unlockAudio(); say(wd[L].split(" / ")[0], L); };
      row.append(btn);
    }
    out.append(row);
  }
}
chips(); list(); packs(); warmFor(targets);
