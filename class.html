<style>
/* Projector-first lesson: a 6-step bar, one big working area, the teacher's script beside it (below on phones) */
:root{
  --bg:#111010; --panel:#1c1a18; --panel2:#24211e; --fg:#f4efe6; --muted:#a39d90; --line:#33302b;
  --gold:#d8ae55; --red:#d8443a; --ok:#5fb37a;
  --font:"Noto Sans JP","Noto Sans Georgian","Noto Sans",system-ui,sans-serif;
  --display:Oswald,"Noto Sans JP","Noto Sans Georgian",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:20px;margin-right:auto;display:flex;gap:10px;align-items:baseline;align-self:center}
.brand b{color:var(--gold)}
.brand a{font-family:var(--font);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.field{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.04em;min-width:0}
.field select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;max-width:min(46vw,260px)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:none;background:none;border-radius:9px;padding:8px 12px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#1a1307;font-weight:700}
.tool{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding-top:14px;max-width:1500px;margin:0 auto}
.steps button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.steps button .n{font-family:var(--display);font-size:18px;color:var(--muted)}
.steps button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.steps button[aria-current="step"]{border-color:var(--gold);background:#2b2416}
.steps button[aria-current="step"] .n{color:var(--gold)}
.steps button.done .n{color:var(--ok)}
@media (max-width:560px){.steps button{font-size:11px;padding:8px 2px}}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding-block:14px;max-width:1500px;margin:0 auto}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:18px;min-height:58vh;min-width:0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.meta .lesson{color:var(--gold);font-weight:700}
h2.head{margin:0;font-size:clamp(24px,3.4vw,40px);text-wrap:balance}
.goal{font-size:clamp(18px,2.4vw,26px);line-height:1.5}
.goal b{color:var(--gold);display:block;font-size:.8em;letter-spacing:.04em}
.tipbox{border:1px solid #4a3d22;background:#211c12;border-radius:16px;padding:14px 16px;line-height:1.6;font-size:16px}
.tipbox b{color:var(--gold);display:block;font-size:13px;letter-spacing:.06em;margin-bottom:4px}
.words{width:100%;border-collapse:collapse;font-size:clamp(15px,1.8vw,20px)}
.words td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.words td.t{font-weight:700}
.words td.r{color:var(--gold)}
.words td.m{color:var(--muted)}
.words td.p{width:52px;text-align:right}
@media (max-width:560px){
  .words tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t p" "r p" "m p";border-bottom:1px solid var(--line);padding:8px 0}
  .words td{border:0;padding:1px 6px}
  .words td.t{grid-area:t}.words td.r{grid-area:r;font-size:14px}.words td.m{grid-area:m;font-size:14px}.words td.p{grid-area:p;align-self:center}
}
.tablebox{overflow-x:auto}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:999px;width:44px;height:44px;font-size:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);padding:0}
.dots button.cur{outline:2px solid var(--gold);outline-offset:2px}
.dots button.s1{background:#6b5a35}.dots button.s2{background:#a8853f}.dots button.s3{background:var(--gold)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.target{font-size:clamp(34px,7vw,88px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.reading{font-size:clamp(18px,3vw,34px);color:var(--gold);overflow-wrap:anywhere}
.meaning{font-size:clamp(17px,2.4vw,28px);color:var(--muted);overflow-wrap:anywhere}
.use{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;max-width:640px;align-self:center}
.reveal{align-self:center;border:1px dashed var(--gold);background:none;color:var(--gold);border-radius:999px;padding:10px 20px;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:14px 22px;font-size:18px;min-height:52px}
.btn.main{background:var(--gold);color:#1a1307;border-color:var(--gold);font-weight:700}
.btn.mic{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.btn.on{animation:none}}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{min-height:54px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stars{font-size:34px;letter-spacing:6px;color:var(--gold)}
.stars .off{color:#3d3830}
.heard{font-size:15px;color:var(--muted)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--panel2)}
.line.B{margin-left:clamp(0px,6vw,80px);background:#1f2228}
.line.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.line .who{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold);min-width:70px}
.line .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.line .txt .t{font-size:clamp(17px,2.2vw,24px);font-weight:700;overflow-wrap:anywhere}
.line .txt .r{font-size:14px;color:var(--gold)}
.line .txt .m{font-size:14px;color:var(--muted)}
.line .hs{font-size:16px;color:var(--gold);min-width:44px;text-align:center}
.side{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;align-self:start}
.side h2{margin:0;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.side ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.55;font-size:15px}
.side .say{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5}
.side .say b{color:var(--gold)}
.side .tip{font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.choice .t{font-size:clamp(19px,2.8vw,30px);font-weight:700;overflow-wrap:anywhere}
.choice .r{font-size:15px;color:var(--gold)}
.choice.right{border-color:var(--ok);background:#1f3326}
.choice.wrong{border-color:var(--red);background:#3a1f1c}
.result{font-family:var(--display);font-size:clamp(40px,8vw,90px);color:var(--gold);text-align:center}
.check{display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:center;font-size:17px;padding:8px 10px;border-radius:12px;background:var(--panel2)}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.check .st{margin-left:auto;color:var(--gold);letter-spacing:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#qr{background:#fff;padding:14px;border-radius:14px}
.url{font-size:13px;color:var(--muted);word-break:break-all;user-select:all}
.pill{border:1px solid var(--gold);color:var(--gold);background:#211c12;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
.pill.paid{border-color:var(--ok);color:var(--ok);background:#18241b}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.plan{border:1px solid var(--line);background:var(--panel2);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.hot{border-color:var(--gold)}
.plan h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.04em}
.plan .can{font-size:15px;line-height:1.55;color:var(--fg)}
.plan .price{font-size:15px;line-height:1.7;color:var(--muted)}
.plan .price b{color:var(--gold);font-size:20px}
.plan a.btn{text-decoration:none;text-align:center;color:inherit;display:block}
.codebox{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.codebox input{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:inherit;font-size:16px;letter-spacing:.08em;text-transform:uppercase;min-width:0;width:220px}
.lockline{text-align:center;color:var(--gold);font-size:15px}
.mission{border:2px dashed var(--red);background:#2a1715;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.mission b{color:#ff8a7e;font-family:var(--display);letter-spacing:.08em;font-size:15px}
.mission .mt{font-size:clamp(17px,2.2vw,22px);line-height:1.5}
.mission.done{border-style:solid;border-color:var(--ok);background:#18241b}
.mission.done b{color:var(--ok)}
.score2{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.score2 div{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 20px;text-align:center}
.score2 div b{display:block;font-family:var(--display);font-size:30px;color:var(--gold)}
.ai{border:1px solid #2f4a63;background:#141c24;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai h3{margin:0;font-family:var(--display);letter-spacing:.06em;color:#8cc4f2;font-size:18px}
.ai .msgs{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto}
.ai .m{border-radius:14px;padding:10px 12px;max-width:88%;display:flex;flex-direction:column;gap:3px}
.ai .m.bot{background:#1d2a36;align-self:flex-start}
.ai .m.me{background:#2b2416;align-self:flex-end;text-align:right}
.ai .m .t{font-size:clamp(17px,2.2vw,22px);font-weight:700;overflow-wrap:anywhere}
.ai .m .r{font-size:14px;color:var(--gold)}
.ai .m .x{font-size:14px;color:var(--muted)}
.ai .fix{font-size:14px;color:#ffcf8a;border-top:1px dashed #4a3d22;padding-top:6px}
.ai input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:inherit;font-size:16px}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
@media print{
  body{background:#fff;color:#111;padding:0}
  .top,.steps,.side,.nav,.actions,.mini,.status,.noprint{display:none!important}
  .wrap{display:block;padding:0}
  .card{border:none;background:#fff;color:#111;min-height:0;padding:0}
  .words td{border-color:#ccc}.words td.r,.check .st{color:#8a6a1f}.words td.m{color:#555}
  .tipbox{background:#fff;border-color:#c9a65a}
  .check label{background:#fff;border:1px solid #ddd}
}
</style>

/* ② Phrase practice */
async function stepPractice(card, L, ex) {
  const P = L.phrases[S.i];
  const dots = h("div", { class: "dots" });
  L.phrases.forEach((_, i) => dots.append(h("button", { class: `${i === S.i ? "cur" : ""} s${stars[starKey(i)] || 0}`, "aria-label": `${i + 1}`, onclick: () => { S.i = i; S.shown = false; S.score = null; render(); } })));
  card.append(h("div", { class: "meta" }, dots, h("span", {}, `${S.i + 1} / ${L.phrases.length}`)));
  const stage = h("div", { class: "stage" }, h("div", { class: "target", lang: S.learn }, P[S.learn]), reading(P, S.learn) ? h("div", { class: "reading" }, reading(P, S.learn)) : null);
  if (S.mode === "class" && !S.shown) stage.append(h("button", { class: "reveal", onclick: () => { S.shown = true; render(); } }, ui.showMeaning));
  else { stage.append(h("div", { class: "meaning", lang: ex }, await meaningOf(P, ex))); if (P.use) stage.append(h("div", { class: "use" }, `💡 ${ui.use}: ${await note(P.use, ex)}`)); }

  card.append(score);
  const mic = h("button", { class: "btn mic" }, ui.speak);
  mic.onclick = async () => { unlockAudio(); const r = await tryIt(P[S.learn], mic); if (!r) return; S.score = r; const n = starsFor(r.s), k = starKey(S.i); if (n > (stars[k] || 0)) stars[k] = n; save(); render(); };
  card.append(h("div", { class: "actions" },
    h("button", { class: "btn main", onclick: () => { unlockAudio(); say(P[S.learn], S.learn); } }, ui.listen),
    h("button", { class: "btn", onclick: () => { unlockAudio(); say(P[S.learn], S.learn, true); } }, ui.slow), mic, wordStar(P, ex)));
  const last = S.i === L.phrases.length - 1;

    last ? nextStepBtn() : h("button", { class: "btn main", onclick: () => { S.i++; S.shown = false; S.score = null; render(); } }, ui.next)));

/* ③ Role-play */
let talkRun = 0;
function stopAll() { talkRun++; S.playing = false; stopListening(); try { speechSynthesis.cancel(); } catch {} try { playing?.stop(); } catch {} }
async function runTalk(role) {
  const my = ++talkRun, L = lesson(); S.playing = role || "all"; render();
  for (let n = 0; n < L.dialogue.length; n++) {
    if (my !== talkRun) return;
    const [who, x] = L.dialogue[n], ln = lineOf(L, x); S.line = n; render();
    if (role === "both" || (role && who === role)) {
      // Student's turn: listen, score, move on
      await new Promise(r => setTimeout(r, 250));
      const btn = document.querySelector(`[data-mic="${n}"]`) || h("button");
      const res = await tryIt(ln[S.learn], btn);
      if (my !== talkRun) return;
      if (res) S.dlgScores[n] = starsFor(res.s); else S.dlgScores[n] ??= 0;
    } else {
      await say(ln[S.learn], S.learn);
      await new Promise(r => setTimeout(r, 350));
    }
  }
  if (my === talkRun) { S.playing = false; S.line = -1; render(); }
}
/* ---------- AI conversation partner (Gemini) ---------- */
async function callAI(request) {
  const r = await fetch(AI.proxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ request }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "AI error");
  return j;
}
let aiUsed = 0; try { aiUsed = +localStorage.getItem("t4c-ai") || 0; } catch {}
const aiAllowed = () => tier !== "none" || aiUsed < AI.freeTurns;
async function askAI(L, ex, history) {
  const roles = L.roles || {};
  const sys = `You are a friendly conversation partner in a language class.
The student is learning ${LANG[S.learn].name} (${S.learn}). Their own language is ${LANG[ex].name} (${ex}).
Scene: "${L.title.en}". You play "${roles.B?.en || "the other person"}"; the student plays "${roles.A?.en || "the student"}".
Useful phrases for this scene: ${L.phrases.map(p => p[S.learn]).join(" / ")}.
Rules: reply ONLY in ${LANG[S.learn].name}, 1–2 short sentences, at the student's level (${({ basic: "beginner", daily: "beginner", mid: "intermediate", adv: "advanced" })[L.level || "basic"]}). Keep the scene going with a question.
If the student's last message had a mistake or sounded unnatural, give a corrected version.
Answer as JSON: {"reply": "...", "meaning": "the reply translated into ${LANG[ex].name}", "fix": "corrected version of the student's sentence in ${LANG[S.learn].name}, or empty", "why": "one short reason in ${LANG[ex].name}, or empty"}`;
  const body = {
    systemInstruction: { parts: [{ text: sys }] },
    contents: history.length ? history.map(m => ({ role: m.who === "me" ? "user" : "model", parts: [{ text: m.who === "me" ? m.text : JSON.stringify({ reply: m.text }) }] }))
                             : [{ role: "user", parts: [{ text: "(Start the scene with your first line.)" }] }],
    generationConfig: { responseMimeType: "application/json", temperature: 0.7, maxOutputTokens: 400, thinkingConfig: { thinkingLevel: "minimal" } },
  };
  const j = await callAI(body);
  const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "{}";
  return JSON.parse(txt.replace(/^```json|```$/g, ""));
}
async function aiTurn(L, ex, userText) {
  const A = S.ai;
  if (userText) A.msgs.push({ who: "me", text: userText });
  if (!aiAllowed()) { A.locked = true; render(); return; }
  A.busy = true; render();
  try {
    const out = await askAI(L, ex, A.msgs);
    if (userText && out.fix && norm(out.fix, S.learn) !== norm(userText, S.learn)) A.msgs[A.msgs.length - 1].fix = { text: out.fix, why: out.why || "" };
    A.msgs.push({ who: "bot", text: out.reply || "…", meaning: out.meaning || "" });
    aiUsed++; try { localStorage.setItem("t4c-ai", String(aiUsed)); } catch {}
    say(out.reply || "", S.learn);
  } catch (e) { st(ui.aiErr + " (" + (e.message || e) + ")"); }
  A.busy = false; render();
  setTimeout(() => { const m = document.querySelector(".ai .msgs"); if (m) m.scrollTop = m.scrollHeight; }, 50);
}
async function aiPanel(L, ex) {
  const box = h("div", { class: "ai" }, h("h3", {}, "🤖 " + ui.aiTitle));
  if (!AI.proxy) { box.append(h("div", { class: "heard" }, ui.aiOff)); return box; }
  if (!S.ai || S.ai.lesson !== L.id + S.learn) {
    box.append(h("div", { class: "heard" }, ui.aiHint));
    if (tier === "none") box.append(h("div", { class: "lockline" }, ui.aiFreeLeft.replace("{n}", Math.max(0, AI.freeTurns - aiUsed))));
    box.append(h("button", { class: "btn main", style: "align-self:flex-start", onclick: () => { unlockAudio(); S.ai = { lesson: L.id + S.learn, msgs: [], busy: false }; aiTurn(L, ex, ""); } }, ui.aiStart));
    return box;
  }
  const A = S.ai, msgs = h("div", { class: "msgs" });
  for (const m of A.msgs) {
    const el = h("div", { class: `m ${m.who}` }, h("span", { class: "t", lang: S.learn }, m.text));
    const rd = reading({ [S.learn]: m.text }, S.learn); if (rd && S.learn !== "ja") el.append(h("span", { class: "r" }, rd));
    if (m.meaning) el.append(h("span", { class: "x" }, m.meaning));
    if (m.who === "bot") el.append(h("button", { class: "mini", style: "align-self:flex-start", onclick: () => say(m.text, S.learn) }, "▶"));
    if (m.fix) el.append(h("div", { class: "fix" }, `✏️ ${ui.aiFix}: ${m.fix.text}${m.fix.why ? " — " + m.fix.why : ""}`));
    msgs.append(el);
  }
  if (A.busy) msgs.append(h("div", { class: "m bot" }, h("span", { class: "x" }, "…")));
  box.append(msgs);
  if (A.locked || !aiAllowed()) {
    box.append(h("div", { class: "lockline" }, "🔒 " + ui.aiLocked), h("button", { class: "btn main", style: "align-self:center", onclick: () => { S.showPlans = true; render(); } }, ui.seePlans));
    return box;
  }
  if (tier === "none") box.append(h("div", { class: "heard" }, ui.aiFreeLeft.replace("{n}", Math.max(0, AI.freeTurns - aiUsed))));
  const mic = h("button", { class: "btn mic" }, ui.speak);
  mic.onclick = async () => {
    unlockAudio(); if (A.busy) return;
    if (rec || Ears.busy()) { stopListening(); return; }
    mic.classList.add("on"); mic.textContent = ui.stop;
    const { alts, err } = await listenOnce(S.learn);
    mic.classList.remove("on"); mic.textContent = ui.speak;
    if (err === "nosr") { st(ui.noMic); return; }
    if (alts[0]) aiTurn(L, ex, alts[0]); else if (err) st(ui.micErr);
  };
  const inp = h("input", { id: "aiIn", placeholder: ui.aiType, autocomplete: "off" });
  const send = () => { const v = inp.value.trim(); if (v && !A.busy) { inp.value = ""; aiTurn(L, ex, v); } };
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send(); });
  box.append(h("div", { class: "actions" }, mic, h("button", { class: "btn", onclick: () => { S.ai = null; render(); } }, ui.aiEnd)),
    h("div", { style: "display:flex;gap:8px" }, inp, h("button", { class: "btn", onclick: send }, ui.aiSend)));
  return box;
}

async function stepTalk(card, L, ex) {
  const roleName = r => L.roles?.[r]?.[ex] || L.roles?.[r]?.en || r;
  card.append(h("div", { class: "actions" },

    const right = mine && S.line === n ? h("button", { class: "btn mic on", "data-mic": String(n), style: "padding:10px 14px;font-size:15px;min-height:44px", onclick: () => stopListening() }, ui.stop)
      : S.dlgScores[n] != null ? h("span", { class: "hs", html: starsHtml(S.dlgScores[n]) }) : play(ln[S.learn]);
    box.append(h("div", { class: `line ${who}${S.line === n ? " now" : ""}` },
      h("span", { class: "who" }, roleName(who)),

/* ④ Listening quiz and ⑤ quiz share one engine */
function makeQuiz() {
  const ps = lesson().phrases;
  return { order: ps.map((p, i) => i).sort(() => Math.random() - 0.5).map(i => ({ p: ps[i], opts: [ps[i], ...ps.filter(q => q !== ps[i]).sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5) })), n: 0, right: 0, picked: null };
}
async function quizView(card, L, ex, key, listening) {
  S[key] ??= makeQuiz(); const Q = S[key];
  if (Q.n >= Q.order.length) {
    card.append(h("div", { class: "stage" }, h("div", { class: "result" }, `${Q.right} / ${Q.order.length}`), h("div", { class: "meaning" }, ui.done)),
      h("div", { class: "nav" }, h("button", { class: "btn", onclick: () => { S[key] = null; render(); } }, ui.again), nextStepBtn()));
    return;
  }
  const cur = Q.order[Q.n];
  card.append(h("div", { class: "meta" }, h("span", {}, listening ? ui.lq : ui.q), h("span", {}, `${Q.n + 1} / ${Q.order.length} · ✓ ${Q.right}`)));
  if (listening) {
    card.append(h("div", { class: "actions" }, h("button", { class: "btn main", style: "font-size:28px;padding:20px 40px", onclick: () => { unlockAudio(); say(cur.p[S.learn], S.learn); } }, "▶"), h("button", { class: "btn", onclick: () => { unlockAudio(); say(cur.p[S.learn], S.learn, true); } }, ui.slow)));
    if (!Q.picked && !cur.played) { cur.played = true; setTimeout(() => say(cur.p[S.learn], S.learn), 300); }
  } else {
    card.append(h("div", { class: "stage" }, h("div", { class: "target", lang: ex, style: "font-size:clamp(28px,5vw,64px)" }, await meaningOf(cur.p, ex))));
  }
  const grid = h("div", { class: "choices" });
  for (const o of cur.opts) {
    let cls = "choice"; if (Q.picked) { if (o === cur.p) cls += " right"; else if (o === Q.picked) cls += " wrong"; }
    const kids = listening ? [h("span", { class: "t", lang: ex }, await meaningOf(o, ex))]
      : [h("span", { class: "t", lang: S.learn }, o[S.learn]), reading(o, S.learn) ? h("span", { class: "r" }, reading(o, S.learn)) : null];
    if (listening && Q.picked) kids.push(h("span", { class: "r", lang: S.learn }, o[S.learn]));
    grid.append(h("button", { class: cls, onclick: () => { unlockAudio(); if (Q.picked) return; Q.picked = o; if (o === cur.p) Q.right++; if (!listening) say(cur.p[S.learn], S.learn); render(); } }, ...kids));
  }
  card.append(grid);
  if (Q.picked) card.append(h("div", { class: "score" }, h("div", { class: "stars" }, Q.picked === cur.p ? ui.right : ui.wrong)),
    h("div", { class: "nav" }, h("span"), h("button", { class: "btn main", onclick: () => { Q.n++; Q.picked = null; render(); } }, ui.next)));
}
