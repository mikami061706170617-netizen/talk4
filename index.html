<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk4 通訳</title>
<meta name="theme-color" content="#111010">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Georgian:wght@400;700&family=Noto+Sans:wght@400;700&display=swap">
<script type="importmap">
{"imports":{"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.min.js"}}
</script>
<style>
/* Table-top layout: partner half (rotated 180°) on top, my half on bottom, settings bar between */
:root{
  --bg:#111010; --panel:#1c1a18; --panel2:#24211e; --fg:#f4efe6; --muted:#9d968a; --line:#33302b;
  --gold:#d8ae55; --red:#d8443a; --ok:#5fb37a;
  --font:"Noto Sans JP","Noto Sans Georgian","Noto Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
.half{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.half.them{transform:rotate(180deg)}
.half.solo .them{display:none}
.lang{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.lang b{color:var(--gold);font-size:15px}
.said{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:6px}
.big{font-size:clamp(22px,6.2vw,34px);line-height:1.35;font-weight:700;overflow-wrap:anywhere}
.big.wait{font-weight:400;color:var(--muted);font-size:18px}
.small{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.rom{font-size:clamp(15px,4.2vw,20px);color:var(--gold);line-height:1.4;overflow-wrap:anywhere}
.rom:empty{display:none}
.ctrl{display:flex;gap:8px;align-items:stretch}
.mic{flex:1;border:none;border-radius:999px;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700;
  padding:16px 12px;cursor:pointer;touch-action:manipulation}
.mic.on{background:var(--gold);color:#1a1307;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.icon{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:999px;min-width:54px;font-size:20px;cursor:pointer}
.typerow{display:flex;gap:8px}
.typerow[hidden]{display:none}
.typerow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.typerow button{border:none;background:var(--gold);color:#1a1307;border-radius:12px;padding:0 16px;font:inherit;font-weight:700}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-block:1px solid var(--line);flex-wrap:wrap}
.bar select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px}
.bar .sw{border:none;background:none;color:var(--gold);font-size:20px;cursor:pointer}
.bar .st{flex:1;min-width:120px;text-align:right;font-size:12px;color:var(--muted)}
.bar .st.ok{color:var(--ok)}
.bar .tog{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.log{display:none}
</style>
</head>
<body>

<section class="half them" id="themHalf">
  <div class="lang"><span id="themLabel"></span><span id="themHint"></span></div>
  <div class="said" id="themSaid"><div class="big wait" id="themBig"></div><div class="rom" id="themRom"></div><div class="small" id="themSmall"></div></div>
  <div class="typerow" id="themType" hidden><input id="themInput" enterkeyhint="send"><button id="themSend">OK</button></div>
  <div class="ctrl"><button class="mic" id="themMic"></button><button class="icon" id="themKb" aria-label="keyboard">⌨</button><button class="icon" id="themRe" aria-label="replay">🔊</button></div>
</section>

<div class="bar">
  <select id="meSel" aria-label="自分の言語"></select>
  <button class="sw" id="swap" aria-label="入れ替え">⇅</button>
  <select id="themSel" aria-label="相手の言語"></select>
  <button class="tog" id="autoSpeak">🔊 自動 ON</button>
  <span class="st" id="status">準備中…</span>
</div>

<section class="half me" id="meHalf">
  <div class="ctrl"><button class="mic" id="meMic"></button><button class="icon" id="meKb" aria-label="キーボード">⌨</button><button class="icon" id="meRe" aria-label="もう一度読む">🔊</button></div>
  <div class="typerow" id="meType" hidden><input id="meInput" enterkeyhint="send" placeholder="文字で入力"><button id="meSend">訳す</button></div>
  <div class="said" id="meSaid"><div class="big wait" id="meBig"></div><div class="rom" id="meRom"></div><div class="small" id="meSmall"></div></div>
  <div class="lang"><span id="meLabel"></span><span id="meHint"></span></div>
</section>

<script type="module">
const LANG = {
  ja:{name:"日本語", g:"ja", sr:"ja-JP", tts:null,                    talk:"🎤 押して話す",     wait:"相手の言葉の訳がここに出ます", hold:"聞いています…"},
  en:{name:"English",g:"en", sr:"en-US", tts:"en_US-hfc_female-medium",talk:"🎤 Tap to speak",   wait:"Translation will appear here",   hold:"Listening…"},
  ka:{name:"ქართული",g:"ka", sr:"ka-GE", tts:"ka_GE-natia-medium",    talk:"🎤 დააჭირე და ილაპარაკე", wait:"თარგმანი აქ გამოჩნდება", hold:"გისმენთ…"},
  ru:{name:"Русский",g:"ru", sr:"ru-RU", tts:"ru_RU-irina-medium",    talk:"🎤 Нажмите и говорите", wait:"Перевод появится здесь", hold:"Слушаю…"},
  ko:{name:"한국어", g:"ko", sr:"ko-KR", tts:null,                    talk:"🎤 눌러서 말하기", wait:"번역이 여기에 나옵니다", hold:"듣고 있어요…"},
  zh:{name:"中文",   g:"zh-CN", sr:"zh-CN", tts:"zh_CN-huayan-medium", talk:"🎤 点击说话", wait:"翻译会显示在这里", hold:"正在听…"},
};
const $ = id => document.getElementById(id);
const st = (t, ok) => { $("status").textContent = t; $("status").classList.toggle("ok", !!ok); };

let me = "ja", them = "ka", autoSpeak = true;
try { const s = JSON.parse(localStorage.getItem("talk4") || "{}");
  if (LANG[s.me]) me = s.me; if (LANG[s.them] && s.them !== me) them = s.them; if (typeof s.autoSpeak === "boolean") autoSpeak = s.autoSpeak; } catch {}
const save = () => { try { localStorage.setItem("talk4", JSON.stringify({ me, them, autoSpeak })); } catch {} };

for (const sel of [$("meSel"), $("themSel")]) for (const k in LANG) sel.add(new Option(LANG[k].name, k));
const last = { me: null, them: null }; // last translation shown on each side: {text, lang}

function paint() {
  $("meSel").value = me; $("themSel").value = them;
  $("meLabel").innerHTML = `<b>${LANG[me].name}</b>`; $("themLabel").innerHTML = `<b>${LANG[them].name}</b>`;
  $("meMic").textContent = LANG[me].talk; $("themMic").textContent = LANG[them].talk;
  if (!last.me) { $("meBig").textContent = LANG[me].wait; $("meBig").className = "big wait"; $("meRom").textContent = ""; $("meSmall").textContent = ""; }
  if (!last.them) { $("themBig").textContent = LANG[them].wait; $("themBig").className = "big wait"; $("themRom").textContent = ""; $("themSmall").textContent = ""; }
  $("autoSpeak").textContent = "🔊 自動 " + (autoSpeak ? "ON" : "OFF");
  $("themInput").placeholder = LANG[them].name;
}
$("meSel").onchange = e => { unlockAudio(); const v = e.target.value; if (v === them) them = me; me = v; langChanged(); };
$("themSel").onchange = e => { unlockAudio(); const v = e.target.value; if (v === me) me = them; them = v; langChanged(); };
$("swap").onclick = () => { unlockAudio(); [me, them] = [them, me]; langChanged(); };
$("autoSpeak").onclick = () => { autoSpeak = !autoSpeak; save(); paint(); };

/* ---------- Translation (free) ---------- */
// Georgian → Latin (national romanization), used when the free service gives none
const KA = {"ა":"a","ბ":"b","გ":"g","დ":"d","ე":"e","ვ":"v","ზ":"z","თ":"t","ი":"i","კ":"k'","ლ":"l","მ":"m","ნ":"n","ო":"o","პ":"p'","ჟ":"zh","რ":"r","ს":"s","ტ":"t'","უ":"u","ფ":"p","ქ":"k","ღ":"gh","ყ":"q'","შ":"sh","ჩ":"ch","ც":"ts","ძ":"dz","წ":"ts'","ჭ":"ch'","ხ":"kh","ჯ":"j","ჰ":"h"};
const kaRoman = t => [...t].map(c => KA[c] ?? c).join("");
function romFor(text, lang, given) {
  if (lang === "en") return "";
  if (given) return given;
  if (lang === "ka") return kaRoman(text);
  return "";
}
async function translate(text, from, to) {
  const sl = LANG[from].g, tl = LANG[to].g;
  try {
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=rm&sl=${sl}&tl=${tl}&q=${encodeURIComponent(text)}`;
    const r = await fetch(u); if (!r.ok) throw 0;
    const j = await r.json();
    const parts = j[0].filter(x => x[0] != null);
    const romRow = j[0].find(x => x[0] == null) || [];
    const out = parts.map(x => x[0]).join("");
    if (out) return { text: out, rom: romFor(out, to, romRow[2]), srcRom: romFor(text, from, romRow[3]) };
  } catch {}
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`);
  const j = await r.json(); const out = j.responseData.translatedText;
  return { text: out, rom: romFor(out, to), srcRom: romFor(text, from) };
}

/* ---------- Speech output (free) ---------- */
// Offline neural voices (Piper, MIT). Stored with the Cache API (works on iPhone Safari too),
// kept loaded in memory, and played through an AudioContext unlocked on the first tap.
const HF = "https://huggingface.co/diffusionstudio/piper-voices/resolve/main/";
const VPATH = {
  "ka_GE-natia-medium": "ka/ka_GE/natia/medium/ka_GE-natia-medium.onnx",
  "ru_RU-irina-medium": "ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx",
  "en_US-hfc_female-medium": "en/en_US/hfc_female/medium/en_US-hfc_female-medium.onnx",
  "zh_CN-huayan-medium": "zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx",
};
const PHON = "https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize";
let ort = null, phonMod = null, actx = null, unlocked = false, playing = null;
const sessions = {}, configs = {};

function nativeVoice(lang) {
  const vs = speechSynthesis?.getVoices?.() || [];
  return vs.find(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(lang));
}
async function cachedFetch(url, onProgress) {
  let cache = null;
  try { cache = await caches.open("talk4-voices"); const hit = await cache.match(url); if (hit) return await hit.arrayBuffer(); } catch {}
  const res = await fetch(url); if (!res.ok) throw new Error("download " + res.status);
  const total = +(res.headers.get("Content-Length") || 0); const reader = res.body.getReader(); const parts = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; if (total && onProgress) onProgress(got / total); }
  const blob = new Blob(parts);
  try { if (cache) await cache.put(url, new Response(blob)); } catch {}
  return await blob.arrayBuffer();
}
async function loadVoice(id, onProgress) {
  if (sessions[id]) return sessions[id];
  ort ??= await import("onnxruntime-web");
  ort.env.wasm.wasmPaths = "https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/";
  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
  const cfgBuf = await cachedFetch(HF + VPATH[id] + ".json");
  configs[id] = JSON.parse(new TextDecoder().decode(cfgBuf));
  const model = await cachedFetch(HF + VPATH[id], onProgress);
  sessions[id] = await ort.InferenceSession.create(model);
  return sessions[id];
}
async function phonemize(text, espeakVoice) {
  phonMod ??= (await import("https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/dist/piper-DeOu3H9E.js")).createPiperPhonemize;
  return new Promise(async (resolve, reject) => {
    try {
      (await phonMod({
        print: l => resolve(JSON.parse(l).phoneme_ids),
        printErr: () => {},
        locateFile: f => f.endsWith(".wasm") ? PHON + ".wasm" : f.endsWith(".data") ? PHON + ".data" : f,
      })).callMain(["-l", espeakVoice, "--input", JSON.stringify([{ text }]), "--espeak_data", "/espeak-ng-data"]);
    } catch (e) { reject(e); }
  });
}
async function synth(text, id) {
  const sess = await loadVoice(id), cfg = configs[id];
  const ids = await phonemize(text, cfg.espeak.voice);
  const feeds = {
    input: new ort.Tensor("int64", BigInt64Array.from(ids.map(BigInt)), [1, ids.length]),
    input_lengths: new ort.Tensor("int64", BigInt64Array.from([BigInt(ids.length)])),
    scales: new ort.Tensor("float32", Float32Array.from([cfg.inference.noise_scale, cfg.inference.length_scale, cfg.inference.noise_w])),
  };
  if (Object.keys(cfg.speaker_id_map || {}).length) feeds.sid = new ort.Tensor("int64", BigInt64Array.from([0n]));
  const out = await sess.run(feeds);
  return { pcm: out.output.data, rate: cfg.audio.sample_rate };
}
function unlockAudio() {
  // Must run inside a tap: lets the phone play sound later, after translation finishes
  try { actx ??= new (window.AudioContext || window.webkitAudioContext)(); if (actx.state !== "running") actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); } catch {}
  if (!unlocked) { unlocked = true; try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {} }
}
function playPCM(pcm, rate) {
  if (!actx) unlockAudio();
  if (actx.state !== "running") actx.resume();
  try { playing?.stop(); } catch {}
  const buf = actx.createBuffer(1, pcm.length, rate); buf.copyToChannel(pcm instanceof Float32Array ? pcm : Float32Array.from(pcm), 0);
  const s = actx.createBufferSource(); s.buffer = buf; s.connect(actx.destination); s.start(0); playing = s;
}
async function warmVoice() {
  // Download (first time only) and load the voice for any chosen language this phone can't speak itself
  for (const lang of [me, them]) {
    const id = LANG[lang].tts;
    if (!id || nativeVoice(lang) || sessions[id]) continue;
    try {
      st(`${LANG[lang].name}の声を準備中…`);
      await loadVoice(id, p => st(`${LANG[lang].name}の声 ${Math.round(p * 100)}%（初回だけ）`));
      await synth("a", id); // warm up so the first real sentence is quick
    } catch (e) { st(`${LANG[lang].name}の声を準備できませんでした。電波を確認して再読み込みしてください`); return; }
  }
  st("準備OK", true);
}
async function speak(text, lang) {
  if (!text) return;
  speechSynthesis?.cancel?.(); try { playing?.stop(); } catch {}
  const nv = nativeVoice(lang);
  if (nv || !LANG[lang].tts) {
    const u = new SpeechSynthesisUtterance(text); u.lang = LANG[lang].sr; if (nv) u.voice = nv;
    speechSynthesis.speak(u); return;
  }
  try {
    st("🔊 音声を作っています…");
    const { pcm, rate } = await synth(text, LANG[lang].tts);
    playPCM(pcm, rate); st("準備OK", true);
  } catch (e) { st("読み上げできませんでした: " + (e?.message || e)); }
}
speechSynthesis?.addEventListener?.("voiceschanged", () => {});

/* ---------- Speech input ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, active = null;

function sideEls(side) { return side === "me"
  ? { mic: $("meMic"), big: $("meBig"), small: $("meSmall"), rom: $("meRom") }
  : { mic: $("themMic"), big: $("themBig"), small: $("themSmall"), rom: $("themRom") }; }

// The last thing someone said, in its original language. Changing a language re-translates it,
// so nobody has to say it again.
let orig = null; // {text, lang, side}
let job = 0;

async function show(o) {
  const my = ++job;
  // Whoever's language matches the original is the speaker; otherwise keep the side it was said on
  const speakerSide = o.lang === me ? "me" : o.lang === them ? "them" : o.side;
  const listenerSide = speakerSide === "me" ? "them" : "me";
  const to = listenerSide === "me" ? me : them;
  const L = sideEls(listenerSide), S = sideEls(speakerSide);
  S.small.textContent = ""; S.big.className = "big"; S.big.textContent = o.text; S.rom.textContent = romFor(o.text, o.lang, o.srcRom);
  last[speakerSide] = { text: o.text, lang: o.lang, own: true };
  L.big.className = "big"; L.big.textContent = "…"; L.rom.textContent = ""; L.small.textContent = o.text;
  if (o.lang === to) { L.big.textContent = o.text; L.rom.textContent = romFor(o.text, to); last[listenerSide] = { text: o.text, lang: to }; return; }
  try {
    const out = await translate(o.text, o.lang, to);
    if (my !== job) return; // a newer sentence or language change took over
    L.big.textContent = out.text; L.rom.textContent = out.rom; last[listenerSide] = { text: out.text, lang: to };
    if (out.srcRom) { o.srcRom = out.srcRom; S.rom.textContent = out.srcRom; }
    if (autoSpeak) speak(out.text, to);
  } catch { if (my === job) { L.big.textContent = "⚠"; st("翻訳できませんでした。電波を確認してください"); } }
}
async function handle(text, speakerSide) {
  text = text.trim(); if (!text) return;
  orig = { text, lang: speakerSide === "me" ? me : them, side: speakerSide };
  show(orig);
}
function langChanged() { save(); last.me = last.them = null; paint(); warmVoice(); if (orig) show(orig); }

// Long recording: keeps listening until you tap again, or after a few seconds of silence.
// Browsers stop on their own after a short pause, so it quietly restarts and keeps the text.
const SILENCE_MS = 5000, MAX_MS = 180000;
let stopWanted = false, silenceTimer = null, maxTimer = null;
function startRec(side) {
  if (!SR) { showType(side); st("このブラウザは音声入力に未対応。⌨で入力してください"); return; }
  if (active) { const was = active; stopRec(); if (was === side) return; }
  const lang = side === "me" ? me : them, E = sideEls(side);
  let done = "", interim = "";
  stopWanted = false; active = side;
  E.mic.classList.add("on"); E.mic.textContent = "■ " + LANG[lang].hold; E.big.className = "big"; E.big.textContent = "…"; E.small.textContent = ""; E.rom.textContent = "";
  const bump = () => { clearTimeout(silenceTimer); silenceTimer = setTimeout(stopRec, SILENCE_MS); };
  maxTimer = setTimeout(stopRec, MAX_MS);
  bump();
  const finish = () => {
    clearTimeout(silenceTimer); clearTimeout(maxTimer);
    E.mic.classList.remove("on"); E.mic.textContent = LANG[lang].talk; active = null; rec = null;
    const t = (done + " " + interim).trim();
    if (t) handle(t, side); else if (!last[side]) { E.big.className = "big wait"; E.big.textContent = LANG[lang].wait; }
  };
  const begin = () => {
    const r = new SR(); rec = r; r.lang = LANG[lang].sr; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
    r.onresult = e => { let fin = "", tmp = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const x = e.results[i]; if (x.isFinal) fin += x[0].transcript; else tmp += x[0].transcript; }
      if (fin) done = (done + " " + fin).trim();
      interim = tmp; E.big.textContent = (done + " " + interim).trim() || "…"; bump(); };
    r.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { st("マイクを許可してください（ブラウザの設定）"); stopWanted = true; }
      else if (e.error === "language-not-supported") { st(`この端末は${LANG[lang].name}の音声入力に未対応。⌨で入力`); showType(side); stopWanted = true; }
    };
    r.onend = () => {
      if (rec !== r) return;
      if (interim) { done = (done + " " + interim).trim(); interim = ""; }
      if (stopWanted) finish(); else { try { begin(); } catch { finish(); } }
    };
    r.start();
  };
  try { begin(); } catch { finish(); }
}
function stopRec() { stopWanted = true; clearTimeout(silenceTimer); try { rec?.stop(); } catch {} }
$("meMic").onclick = () => { unlockAudio(); startRec("me"); };
$("themMic").onclick = () => { unlockAudio(); startRec("them"); };

function showType(side) { const row = $(side + "Type"); row.hidden = !row.hidden; if (!row.hidden) $(side + "Input").focus(); }
$("meKb").onclick = () => showType("me"); $("themKb").onclick = () => showType("them");
for (const side of ["me", "them"]) {
  const send = () => { unlockAudio(); const v = $(side + "Input").value; $(side + "Input").value = ""; handle(v, side); };
  $(side + "Send").onclick = send;
  $(side + "Input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send(); });
}
