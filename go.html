<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk4 かんたん通訳</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#0f0e0d;--card:#1c1a18;--line:#35302a;--ink:#f6f1e7;--muted:#a69d8e;--gold:#d8ae55;--blue:#6aa8ff;--red:#e2574c;--ok:#58b97a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
h1{font-size:17px;margin:0;letter-spacing:.04em;white-space:nowrap}h1 b{color:var(--gold)}
.sp{flex:1}
.tool{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px}
.tool.on{border-color:var(--gold);color:var(--gold)}
.scenes{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.scenes button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:15px;white-space:nowrap}
.scenes button.on{background:var(--gold);color:#1a1307;border-color:var(--gold);font-weight:700}
.langs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:6px}
.langs label{display:block;font-size:11px;color:var(--muted);margin:0 0 2px 4px}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-size:16px}
#swap{background:none;border:0;font-size:20px;padding:14px 4px 0}
#main{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:#141211;padding:8px}
.empty{color:var(--muted);text-align:center;padding:26px 12px;line-height:1.8;font-size:15px}
.m{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--gold)}
.m.you{border-left-color:var(--blue)}
.m .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.m .src{font-size:calc(16px*var(--z,1));color:#cfc6b6;margin:2px 0 6px;line-height:1.45}
.m .tr{font-size:calc(25px*var(--z,1));font-weight:700;line-height:1.35;word-break:break-word}
.m .rom{font-size:calc(14px*var(--z,1));color:var(--gold);margin-top:2px}
.m .back{font-size:calc(14px*var(--z,1));color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.5}
.m .back.warn{color:#ffb86b}
.m .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.m .acts button{background:#26231f;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;white-space:nowrap}
.m .num{font-size:calc(14px*var(--z,1));color:#ffb86b;margin-top:6px}
#show{position:fixed;inset:0;background:#fff;color:#111;z-index:30;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
#show.open{display:flex}
#show .big{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.3;word-break:break-word;overflow-y:auto}
#show .sub{text-align:center;color:#666;font-size:17px;margin-bottom:10px}
#show .bar{display:flex;gap:10px;justify-content:center}
#show .bar button{background:#111;color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:700}
.item{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;margin-bottom:6px;font-size:17px}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.dg{background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:5px;font-size:15px;line-height:1.5}
.dg.ng{border-left:4px solid var(--red)}.dg.ok{border-left:4px solid var(--ok)}.dg.wn{border-left:4px solid #ffb86b}
.favrow{display:flex;gap:6px;align-items:stretch}.favrow .ph{flex:1}.favrow .x{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;padding:0 12px;color:var(--muted)}
textarea.out{width:100%;height:42dvh;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.badge{font-size:11px;border:1px solid var(--ok);color:var(--ok);border-radius:6px;padding:0 5px}
#status{min-height:22px;text-align:center;font-size:15px;color:var(--gold);padding:4px 0}
.typer{display:flex;gap:6px;margin-bottom:6px}
.typer input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px}
.typer button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;white-space:nowrap}
/* transcribe */
#txUI{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.txside{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.txside button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:15px}
.txside button.on{border-color:var(--gold);background:#2b2416;color:var(--gold);font-weight:700}
#txGo{border:0;border-radius:16px;min-height:66px;font-size:19px;font-weight:800;background:var(--gold);color:#14110a}
#txGo.on{background:var(--red);color:#fff;animation:p 1.2s infinite}
.tx{padding:8px 6px 10px;border-bottom:1px solid var(--line)}
.tx .o{font-size:calc(17px*var(--z,1));color:#cfc6b6;line-height:1.5}
.tx .t{font-size:calc(23px*var(--z,1));font-weight:700;line-height:1.4;margin-top:2px}
.tx .t.wait{color:var(--muted);font-weight:400;font-size:15px}
.tx.live .o{color:var(--ink);font-size:calc(21px*var(--z,1));font-weight:600}
.tx.live .o::after{content:"▍";color:var(--gold);animation:p 1s infinite}
.autob{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;margin-bottom:6px}
.autob.on{background:var(--ok);border-color:var(--ok);color:#0c1a10;font-weight:700}
.mic.turn{outline:4px solid #fff;outline-offset:-4px}
.mics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:8px}
.mic{border:0;border-radius:16px;min-height:76px;font-size:18px;font-weight:700;color:#14110a;background:var(--gold);line-height:1.3;padding:6px}
.mic.you{background:var(--blue)}
.mic small{display:block;font-size:13px;font-weight:500;opacity:.8}
.mic.on{background:var(--red);color:#fff;animation:p 1s infinite}
.mic:disabled{opacity:.45}
@keyframes p{50%{opacity:.75}}
/* sheet */
#sheet{position:fixed;inset:0;background:#000b;display:none;z-index:20;align-items:flex-end}
#sheet.open{display:flex}
#sheet .box{background:var(--bg);border-radius:18px 18px 0 0;width:100%;max-height:82dvh;display:flex;flex-direction:column;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}
#sheet .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#sheet .top b{font-size:17px;flex:1}
#sheet .list{overflow-y:auto}
.ph{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ph .a{font-size:17px;font-weight:700}.ph .b{font-size:15px;color:var(--gold);margin-top:2px}
.grp{font-size:13px;color:var(--muted);margin:10px 4px 6px}
/* class */
.lesson{display:flex;gap:6px;margin-bottom:8px}
.cardp{text-align:center;padding:14px 8px}
.cardp .n{font-size:13px;color:var(--muted)}
.cardp .t{font-size:calc(32px*var(--z,1));font-weight:800;line-height:1.3;margin:10px 0 4px;word-break:break-word}
.cardp .r{font-size:calc(18px*var(--z,1));color:var(--gold)}
.cardp .j{font-size:calc(18px*var(--z,1));color:#cfc6b6;margin-top:8px}
.cardp .stars{font-size:34px;letter-spacing:4px;min-height:44px;margin-top:8px}
.cardp .heard{font-size:14px;color:var(--muted);min-height:20px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.row button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:17px}
.row .go{background:var(--gold);color:#14110a;border-color:var(--gold);font-weight:700}
.row .rec{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>TALK4 <b>かんたん通訳</b></h1><span class="sp"></span>
  <button class="tool" id="zoom">A＋</button>

  <button class="tool" id="menu">☰</button>

<div class="scenes" id="scenes"></div>
<div class="langs">
  <div><label>わたし</label><select id="me"></select></div>
  <button id="swap" aria-label="swap">⇄</button>
  <div><label>相手</label><select id="you"></select></div>
</div>
<div id="main"></div>
<div id="status"></div>
<div id="talkUI">
  <div class="typer"><input id="tin" placeholder="文字で入力（どちらの言葉でもOK）" enterkeyhint="send" autocomplete="off"><button id="tsend">訳す</button><button id="phr">📋 定型文</button></div>
  <button id="auto" class="autob">🔁 自動で聞く（交互に話す）</button>

</div>
<div id="show"><div class="sub" id="showSub"></div><div class="big" id="showBig"></div><div class="bar"><button id="showSay">🔊</button><button id="showClose">✕ 閉じる</button></div></div>
<div id="txUI" hidden>
  <div class="txside"><button id="txMe"></button><button id="txYou"></button></div>
  <button id="txGo">● 話すと文字になる（スタート）</button>
</div>
<div id="sheet"><div class="box"><div class="top"><b id="shTitle"></b><button class="tool" id="shClose">✕ 閉じる</button></div><div class="list" id="shList"></div></div></div>

<script type="module">
const $ = id => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else if (v != null && v !== false) e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null && c !== false) e.append(c); return e; };
const LANG = {
  ja: { name: "日本語", g: "ja", sr: "ja-JP", speak: "話す", partner: "相手" },
  en: { name: "English", g: "en", sr: "en-US", speak: "Speak", partner: "Partner" },
  ka: { name: "ქართული", g: "ka", sr: "ka-GE", speak: "ილაპარაკეთ", partner: "პარტნიორი" },
  ru: { name: "Русский", g: "ru", sr: "ru-RU", speak: "Говорите", partner: "Собеседник" },
  ko: { name: "한국어", g: "ko", sr: "ko-KR", speak: "말하기", partner: "상대방" },
  zh: { name: "中文", g: "zh-CN", sr: "zh-CN", speak: "请说", partner: "对方" },
};
const SCENES = [
  { id: "biz", label: "💼 商談", lessons: ["meeting", "negotiate", "reserve", "online"] },
  { id: "tx", label: "📝 話す→文字", lessons: null },
  { id: "cook", label: "🍳 料理教室", lessons: ["cooking", "restaurant", "market"] },
  { id: "shop", label: "🍽 お店", lessons: ["restaurant", "cafe", "money", "complain"] },
  { id: "daily", label: "👋 日常", lessons: ["greet", "intro", "help", "taxi"] },
  { id: "class", label: "📘 語学教室", lessons: null },
];
const store = { get: (k, d) => { try { const v = JSON.parse(localStorage.getItem("go-" + k)); return v ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem("go-" + k, JSON.stringify(v)); } catch {} } };
const S = { me: store.get("me", "ja"), you: store.get("you", "en"), scene: store.get("scene", "biz"), voice: store.get("voice", true), zoom: store.get("zoom", 0), log: store.get("log", []).filter(m => m.tr && !/^⚠/.test(m.tr)), lesson: store.get("lesson", "greet"), pi: 0 };
const st = t => { $("status").textContent = t || ""; };
const VER = "go-7t2";

/* ---------- translation (free: Google), with names kept and a check translation back ---------- */
let Names = null; import("./names.js").then(m => Names = m).catch(() => {});
async function gtxOnce(text, from, to, host) {
  const u = `https://${host}/translate_a/single?client=gtx&dt=t&dt=rm&sl=${LANG[from]?.g || "auto"}&tl=${LANG[to].g}&q=${encodeURIComponent(text)}`;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 7000);
  try {
    const j = await fetch(u, { signal: ctl.signal }).then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); });
    const text2 = j[0].filter(x => x[0] != null).map(x => x[0]).join(""), romRow = j[0].find(x => x[0] == null) || [];
    if (!text2) throw new Error("empty");
    return { text: text2, rom: romRow[2] || "", detected: j[2] };
  } finally { clearTimeout(tm); }
}
// Google first (two addresses), then a second free translator, then the AI: one of them always answers
async function gtx(text, from, to) {
  text = text.slice(0, 1200);
  for (const host of ["translate.googleapis.com", "clients5.google.com", "translate.googleapis.com"]) { try { return await gtxOnce(text, from, to, host); } catch (e) { gtx.last = e?.message || String(e); } }
  try {
    const j = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 450))}&langpair=${LANG[from].g}|${LANG[to].g}`).then(r => r.json());
    if (j.responseData?.translatedText && j.responseStatus == 200) return { text: j.responseData.translatedText, rom: "" };
  } catch (e) { gtx.last = e?.message || String(e); }
  if (AIproxy) {
    const j = await fetch(AIproxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ request: { contents: [{ parts: [{ text: `Translate from ${LANG[from].name} into ${LANG[to].name}. Reply ONLY JSON {"text":""}.\n${text}` }] }], generationConfig: { responseMimeType: "application/json", temperature: 0 } } }) }).then(r => r.json());
    const t = JSON.parse((j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").replace(/^```json|```$/g, "").trim()).text;
    if (t) return { text: t, rom: "" };
  }
  throw new Error(gtx.last || "offline");
}
async function translate(text, from, to) {
  let src = text; try { if (Names) src = Names.preNames(text); } catch {}
  const r = await gtx(src, from, to);
  try { if (Names) r.text = Names.postNames(r.text, to); } catch {}
  return r;
}
const norm = s => s.toLowerCase().replace(/[\s、。，．,.!?！？「」『』()（）'"’“”…・:;：；\-]/g, "");
function similar(a, b) {   // 0..1, shared two-letter pieces
  a = norm(a); b = norm(b); if (!a || !b) return 0; if (a === b) return 1;
  const bi = s => { const m = new Map(); for (let i = 0; i < Math.max(1, s.length - 1); i++) { const k = s.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
  const A = bi(a), B = bi(b); let hit = 0, tot = 0; for (const [k, v] of A) { hit += Math.min(v, B.get(k) || 0); tot += v; } for (const v of B.values()) tot += v;
  const two = 2 * hit / tot;
  // the same meaning often comes back in other words ("4人" -> "4名様"): also count shared single letters, so only a really different sentence is flagged
  const uni = s => { const m = new Map(); for (const c of s) m.set(c, (m.get(c) || 0) + 1); return m; }, U = uni(a), V = uni(b); let h1 = 0; for (const [k, v] of U) h1 += Math.min(v, V.get(k) || 0);
  return /[぀-ヿ一-鿿가-힯]/.test(a) ? Math.max(two, 2 * h1 / ([...a].length + [...b].length) * 0.62) : two;
}

// numbers must survive the translation (prices, times, quantities): show both when they differ
function numsOf(s) {
  s = (s || "").normalize("NFKC").replace(/(\d),(?=\d{3})/g, "$1");
  const mul = (re, k) => { s = s.replace(re, (_, n) => String(Math.round(n * k))); };
  mul(/(\d+(?:\.\d+)?)\s*(?:億|billion)/gi, 1e8); mul(/(\d+(?:\.\d+)?)\s*million/gi, 1e6); mul(/(\d+(?:\.\d+)?)\s*万/g, 1e4); mul(/(\d+(?:\.\d+)?)\s*(?:千|thousand)/gi, 1e3);
  return (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
}
function numCheck(a, b) { const A = numsOf(a), B = numsOf(b); if (!A.length) return ""; return A.some(x => !B.includes(x) && !(x > 12 && x <= 24 && B.includes(x - 12))) ? `元の数字 ${A.join("・")} ／ 訳の数字 ${B.join("・") || "なし"}` : ""; }

/* ---------- voice out ---------- */
let actx = null;
function unlock() {   // called inside a tap: lets the phone speak later
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
  try { if (!unlock.done && window.speechSynthesis) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); unlock.done = true; } } catch {}
}
const voiceFor = lang => { const vs = window.speechSynthesis?.getVoices?.() || [], code = LANG[lang].sr.slice(0, 2); return vs.find(v => v.lang.replace("_", "-") === LANG[lang].sr) || vs.find(v => v.lang.startsWith(code)); };
window.speechSynthesis?.addEventListener?.("voiceschanged", () => {});
let AIproxy = ""; import("./config.js").then(m => AIproxy = m.AI?.proxy || "").catch(() => {});
let playing = null;
function stopSay() { try { speechSynthesis.cancel(); } catch {} try { playing?.stop(); } catch {} playing = null; }
async function say(text, lang, slow) {
  stopSay(); if (!text) return;
  const v = voiceFor(lang);
  if (window.speechSynthesis && (v || lang !== "ka")) return new Promise(done => {   // the phone lists its voices late: speak by language even before the list arrives
    const u = new SpeechSynthesisUtterance(text); if (v) u.voice = v; u.lang = v?.lang || LANG[lang].sr; u.rate = slow ? 0.6 : 0.95; u.volume = 1;
    let started = false; u.onstart = () => started = true; u.onend = u.onerror = () => done();
    speechSynthesis.speak(u);

  });

}
async function sayAI(text, slow) {   // languages the phone has no voice for (Georgian)
  if (!AIproxy || !actx) { st("🔇 この言葉の声はこの端末にありません。画面を相手に見せてください"); return; }
  try {
    const j = await fetch(AIproxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ task: "speak", text, g: "f" }) }).then(r => r.json());
    if (!j.audio) throw 0;
    let bin = atob(j.audio), rate = +((j.mime || "").match(/rate=(\d+)/) || [0, 24000])[1];
    if (bin.startsWith("RIFF")) { rate = bin.charCodeAt(24) | (bin.charCodeAt(25) << 8) | (bin.charCodeAt(26) << 16); bin = bin.slice(44); }
    const n = bin.length >> 1, buf = actx.createBuffer(1, n, rate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { let x = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (x > 32767) x -= 65536; d[i] = x / 32768; }
    const src = actx.createBufferSource(); src.buffer = buf; src.playbackRate.value = slow ? 0.8 : 1; src.connect(actx.destination); playing = src; src.start();
    await new Promise(r => { src.onended = r; setTimeout(r, n / rate * 1300 + 800); });
  } catch { st("🔇 声を出せませんでした。画面を相手に見せてください"); }
}

/* ---------- voice in: the phone's own recognizer for Japanese/English, the AI ears for the rest ---------- */
let Ears = null; import("./ears.js").then(m => Ears = m).catch(() => {});
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let stopListen = null;
// Which ears: the browser's own recognizer (Chrome = Google's, iPhone = Apple's) is free and hears well; the AI only for
// Georgian on iPhone (Apple has no Georgian) or a language that failed on this device before
const CHROME_LIKE = !IOS && /Chrome|Chromium|Edg\//.test(navigator.userAgent);
const aiMark = store.get("aiears", {});
function useAI(lang) { return !SR || !!aiMark[lang] || (IOS && lang === "ka") || (IOS && navigator.standalone) || (!CHROME_LIKE && !IOS && !["ja", "en"].includes(lang)); }
function markAI(lang) { aiMark[lang] = true; store.set("aiears", aiMark); }
function listen(lang, long) {
  return new Promise(resolve => {
    const viaAI = async () => {
      if (!Ears) return resolve({ text: "", err: "noai" });
      stopListen = () => Ears.stopAI();
      const r = await Ears.aiOnce(lang, long ? true : false, s => { if (s === "wait") st("⏳ 聞き取っています…"); });

  if (S.scene === "tx") { const d = new Date(); return `Talk4 文字起こし ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}\n\n` + TX.lines.map(l => `${l.text}\n→ ${l.tr || ""}`).join("\n\n"); }
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return `Talk4 会話の記録 ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}\n\n` + S.log.filter(m => m.tr).map(m => `${z(new Date(m.t).getHours())}:${z(new Date(m.t).getMinutes())} ${m.mine ? "わたし" : "相手"}（${LANG[m.from].name}）\n${m.text}\n→ ${m.tr}`).join("\n\n");
}
async function exportLog() {
  if (S.scene === "tx" ? !TX.lines.length : !S.log.length) { $("sheet").classList.remove("open"); st("まだ会話がありません"); return; }
  const text = logText();
  try { if (navigator.share) { await navigator.share({ title: "Talk4 会話の記録", text }); $("sheet").classList.remove("open"); return; } } catch (e) { if (e?.name === "AbortError") return; }
  let copied = false; try { await navigator.clipboard.writeText(text); copied = true; } catch {}
  openSheet("📤 会話の記録", h("div", { class: "grp" }, copied ? "コピーしました。メールやLINEに貼り付けてください。" : "下の文を長押しして、すべて選択 → コピーしてください。"), h("textarea", { class: "out", readonly: "" }, text));
}
async function diagnose() {
  const list = h("div"), add = (cls, t) => list.append(h("div", { class: "dg " + cls }, t));
  openSheet("🩺 うまく動かないとき", h("div", { class: "grp" }, "調べています… 終わったら、この画面の写真（スクリーンショット）を送ってください。"), list);
  const ua = navigator.userAgent, inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);
  add(inApp ? "ng" : "ok", inApp ? "✕ アプリの中のブラウザで開いています。マイクが使えません。iPhoneはSafari、MacはChromeで開いてください。" : "✓ ブラウザ：" + (/CriOS/.test(ua) ? "Chrome(iPhone)" : /Safari/.test(ua) && !/Chrome/.test(ua) ? "Safari" : /Chrome/.test(ua) ? "Chrome" : "その他") + (IOS ? "・iPhone/iPad" : ""));
  add(navigator.onLine ? "ok" : "ng", navigator.onLine ? "✓ インターネット：つながっています" : "✕ インターネットにつながっていません");
  for (const [name, host] of [["通訳①", "translate.googleapis.com"], ["通訳②", "clients5.google.com"]]) { const t0 = performance.now(); try { const r = await gtxOnce("こんにちは", "ja", "en", host); add("ok", `✓ ${name}：動いています（${Math.round(performance.now() - t0)}ms・${r.text}）`); } catch (e) { add("wn", `△ ${name}：使えません（${e?.message || e}）`); } }
  try { const j = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent("こんにちは")}&langpair=ja|en`).then(r => r.json()); add(j.responseStatus == 200 ? "ok" : "wn", (j.responseStatus == 200 ? "✓" : "△") + " 通訳③（予備）：" + (j.responseData?.translatedText || j.responseStatus)); } catch (e) { add("wn", "△ 通訳③（予備）：使えません（" + (e?.message || e) + "）"); }
  if (AIproxy) { const t0 = performance.now(); try { const j = await fetch(AIproxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ request: { contents: [{ parts: [{ text: "Reply with the single word OK." }] }], generationConfig: { temperature: 0 } } }) }).then(r => r.json()); const ok = !!j.candidates; add(ok ? "ok" : "wn", (ok ? "✓" : "△") + ` AI（聞き取り・ジョージア語の声）：${ok ? "動いています" : (j.error?.message || j.error || "返事なし").toString().slice(0, 80)}（${Math.round(performance.now() - t0)}ms・${j.t4 || "-"}）`); } catch (e) { add("ng", "✕ AI（聞き取り・ジョージア語の声）：つながりません（" + (e?.message || e) + "）"); } }
  else add("ng", "✕ AIの設定が読めません");
  let micState = "?"; try { micState = (await navigator.permissions.query({ name: "microphone" })).state; } catch {}
  add(micState === "denied" ? "ng" : micState === "granted" ? "ok" : "wn", micState === "denied" ? "✕ マイク：拒否になっています。設定 → アプリ → Safari → マイク → 許可" : micState === "granted" ? "✓ マイク：許可されています" : "△ マイク：まだ聞かれていません（マイクのボタンを押すと聞かれます → 許可）");
  add(navigator.mediaDevices?.getUserMedia ? "ok" : "ng", navigator.mediaDevices?.getUserMedia ? "✓ 録音の機能：あります" : "✕ 録音の機能がありません（https で開いていますか？）");
  add("ok", "✓ 聞き取りの方法：" + Object.keys(LANG).map(l => LANG[l].name + "=" + (useAI(l) ? "AI" : "本体")).join("／"));
  await new Promise(r => setTimeout(r, 300)); const vs = window.speechSynthesis?.getVoices?.() || [];
  add(vs.length ? "ok" : "wn", (vs.length ? "✓" : "△") + " 声：" + Object.keys(LANG).map(l => LANG[l].name + "=" + (voiceFor(l) ? "あり" : l === "ka" ? "AIの声" : "一覧なし（言語指定で読みます）")).join("／"));
  add("ok", "版：" + VER + "・" + new Date().toLocaleString("ja-JP"));
  list.previousSibling.textContent = "調べ終わりました。✕ や △ があれば、この画面の写真（スクリーンショット）を送ってください。";
}
function openMenu() {
  openSheet("☰ メニュー",
    h("button", { class: "item", onclick: exportLog }, "📤", h("div", {}, "会話の記録を送る・コピーする", h("small", {}, "商談のメモとして、メールやLINEに送れます"))),
    h("button", { class: "item", onclick: () => { $("sheet").classList.remove("open"); stopSay(); if (S.scene === "tx") { TX.lines = []; store.set("tx", []); } else { S.log = []; store.set("log", []); } paint(); } }, "🗑", h("div", {}, "会話を消す", h("small", {}, "画面の会話をすべて消します（マイ定型文は残ります）"))),
    h("button", { class: "item", onclick: diagnose }, "🩺", h("div", {}, "うまく動かないとき", h("small", {}, "通訳・マイク・声を自動で調べます"))),
    h("a", { class: "item", href: "index.html", style: "text-decoration:none;color:inherit" }, "↩", h("div", {}, "前のTalk4に戻る")));
}

/* ---------- controls ---------- */
function paintUI() {
  $("scenes").replaceChildren(...SCENES.map(s => h("button", { class: s.id === S.scene ? "on" : "", onclick: () => { if (auto) autoStop(""); if (TX.on) txStop(""); stopSay(); stopListen?.(); S.scene = s.id; store.set("scene", s.id); paintUI(); paint(); } }, s.label)));
  for (const [id, key] of [["me", "me"], ["you", "you"]]) $(id).replaceChildren(...Object.entries(LANG).map(([k, v]) => h("option", { value: k, selected: S[key] === k }, v.name)));
  $("micMe").innerHTML = `🎤 わたし<small>${LANG[S.me].name}</small>`;
  $("micYou").innerHTML = `🎤 ${LANG[S.you].partner}<small>${LANG[S.you].speak}・${LANG[S.you].name}</small>`;
  $("talkUI").hidden = S.scene === "class" || S.scene === "tx"; $("txUI").hidden = S.scene !== "tx"; txPaintBar();
  $("voice").textContent = S.voice ? "🔊" : "🔇"; $("voice").classList.toggle("on", S.voice);
  document.documentElement.style.setProperty("--z", [1, 1.25, 1.55][S.zoom]); $("zoom").textContent = S.zoom === 2 ? "A－" : "A＋";
  st("");
}
$("me").onchange = e => { S.me = e.target.value; if (S.me === S.you) S.you = S.me === "ja" ? "en" : "ja"; store.set("me", S.me); store.set("you", S.you); paintUI(); paint(); };
$("you").onchange = e => { S.you = e.target.value; if (S.me === S.you) S.me = S.you === "ja" ? "en" : "ja"; store.set("me", S.me); store.set("you", S.you); paintUI(); paint(); };
$("swap").onclick = () => { if (TX.on) txStop(""); [S.me, S.you] = [S.you, S.me]; store.set("me", S.me); store.set("you", S.you); paintUI(); paint(); };
$("zoom").onclick = () => { S.zoom = (S.zoom + 1) % 3; store.set("zoom", S.zoom); paintUI(); };
$("voice").onclick = () => { S.voice = !S.voice; store.set("voice", S.voice); if (!S.voice) stopSay(); paintUI(); };
$("menu").onclick = openMenu;
$("showClose").onclick = () => $("show").classList.remove("open"); $("showSay").onclick = () => { unlock(); if (shown) say(shown.tr, shown.to); };
$("showBig").onclick = () => $("show").classList.remove("open");
if (/voicetest/.test(location.hash)) { const b = h("button", { class: "autob", onclick: voiceTest }, "🔊 例文を流す（テスト用）"); $("txUI").append(b, h("pre", { id: "dbg", style: "font-size:11px;max-height:90px;overflow:auto;margin:0;color:#9c9" })); }
$("txGo").onclick = () => TX.on ? txStop("") : txStart();
$("txMe").onclick = () => txSide("me"); $("txYou").onclick = () => txSide("you");
$("auto").onclick = () => { unlock(); if (auto) return autoStop(""); if (stopListen) stopListen(); autoSide = "me"; autoRun(); };
$("micMe").onclick = () => mic("me"); $("micYou").onclick = () => mic("you");
const sendTyped = async () => { unlock(); const v = $("tin").value.trim(); if (!v) return; $("tin").value = ""; $("tin").blur(); utter(v, await detect(v)); };
$("tsend").onclick = sendTyped;
$("tin").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) sendTyped(); });
$("phr").onclick = openPhrases; $("shClose").onclick = () => $("sheet").classList.remove("open");
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").classList.remove("open"); };
paintUI(); paint();
if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent)) st("⚠ アプリの中のブラウザではマイクが使えません。Safari（Macは Chrome）で開いてください");
window.__go = { S, utter, TX, useAI };
</script>
