*{box-sizing:border-box}

.top{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}

.tool{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}

// Male voices where a free one exists; otherwise the normal voice (lowering it made speech sound broken)
const MALE = { en: "en_US-hfc_male-medium", ru: "ru_RU-dmitri-medium" };
const isMale = v => /(?:^|[^e])male|otoya|hattori|ichiro|daniel|aaron|alex\b|fred|arthur|gordon|rishi|reed|eddy|rocko|grandpa|ralph|albert|bruce|junior|yuri|xander|li-mu|yu-shu|injoon|eric|thomas|dmitri|pavel/i.test(v.name);

let ort = null, phonMod = null, actx = null, unlocked = false, playing = null;
const sessions = {}, configs = {};

function nativeVoices(lang) {
  const vs = speechSynthesis?.getVoices?.() || [];

// How to say something in this language with this gender: a phone voice, or a downloaded one
function voicePlan(lang, g) {
  // Russian, Georgian, English and Chinese always use the downloaded voices: phones often list a
  // built-in voice for these that is not actually installed, and then nothing is heard.
  if (g === "m" && MALE[lang]) return { id: MALE[lang], rate: 1 };

/* ---------- Screen words ---------- */
const UI = {
  ja: { title: "参加する人", hint: "2〜4人まで。名前（なくてもOK）と、その人が話す言葉を選んでください。話すときは自分のボタンを押します。", add: "＋ 人を追加", done: "はじめる",
        name: "名前", empty: "自分のボタンを押して話すと、ほかの全員の言葉に訳されて読み上げられます。", auto: "🎙 置いておくだけ通訳（AIが言葉を聞き分ける）", autoOn: "■ ずっと聞いています（もう一度押すと止まる）",
        speakOn: "🔊 自動 ON", speakOff: "🔊 自動 OFF", typePh: "文字で入力（言語は自動で判定）", detected: "判定", noSr: "このブラウザは音声入力に未対応です。⌨で入力してください", micErr: "マイクが使えませんでした。もう一度押してください",
        listening: "聞いています…", translating: "訳しています…", ready: "✓ OK", aiErr: "言葉を聞き分けられませんでした。自分のボタンで話してください" },
  en: { title: "Who's talking?", hint: "Up to 4 people. Add a name (optional) and the language each person speaks. Press your own button when you talk.", add: "+ Add person", done: "Start",
        name: "Name", empty: "Press your button and speak. Everyone else sees and hears it in their own language.", auto: "🎙 Hands-free (AI detects every language)", autoOn: "■ Listening all the time (press to stop)",
        speakOn: "🔊 Auto ON", speakOff: "🔊 Auto OFF", typePh: "Type (language detected automatically)", detected: "detected", noSr: "Voice input isn't supported here. Use ⌨ to type", micErr: "The microphone didn't start. Press again",
        listening: "Listening…", translating: "Translating…", ready: "✓ OK", aiErr: "Couldn't tell the language. Please use your own button" },
};
const pickLang = c => { c = (c || "").toLowerCase(); return c.startsWith("zh") ? "zh" : LANG[c.slice(0, 2)] ? c.slice(0, 2) : null; };
const uiLang = (navigator.languages || [navigator.language]).map(pickLang).find(Boolean) === "ja" ? "ja" : "en";
const ui = UI[uiLang];

/* ---------- People ---------- */
const COLORS = ["var(--p0)", "var(--p1)", "var(--p2)", "var(--p3)"];
let people = [{ name: "", lang: "ja" }, { name: "", lang: "ka" }], autoSpeak = true, log = [];
try { const s = JSON.parse(localStorage.getItem("t4g") || "null"); if (s?.people?.length) people = s.people.filter(p => LANG[p.lang]).slice(0, 4); if (typeof s?.autoSpeak === "boolean") autoSpeak = s.autoSpeak; } catch {}
const save = () => { try { localStorage.setItem("t4g", JSON.stringify({ people, autoSpeak })); } catch {} };
const label = (p, i) => p.name?.trim() || `${i + 1}`;
const langsInRoom = () => [...new Set(people.map(p => p.lang))];

function paintSetup() {
  $("setTitle").textContent = ui.title; $("setHint").textContent = ui.hint; $("addBtn").textContent = ui.add; $("doneBtn").textContent = ui.done;
  $("addBtn").hidden = people.length >= 4;
  const rows = $("rows"); rows.replaceChildren();
  people.forEach((p, i) => {
    const sel = document.createElement("select"); sel.id = `pl${i}`; sel.setAttribute("aria-label", "language");
    for (const k in LANG) sel.add(new Option(LANG[k].name, k)); sel.value = p.lang; sel.onchange = () => { p.lang = sel.value; };
    const inp = document.createElement("input"); inp.id = `pn${i}`; inp.placeholder = `${ui.name} ${i + 1}`; inp.value = p.name || ""; inp.oninput = () => { p.name = inp.value; };
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = COLORS[i];
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "remove"); x.hidden = people.length <= 2;
    x.onclick = () => { people.splice(i, 1); paintSetup(); };
    const row = document.createElement("div"); row.className = "row"; row.append(dot, inp, sel, x); rows.append(row);
  });
}
$("addBtn").onclick = () => { if (people.length < 4) { people.push({ name: "", lang: ["en", "ru", "ko", "zh", "ja", "ka"].find(l => !people.some(p => p.lang === l)) || "en" }); paintSetup(); } };
$("doneBtn").onclick = () => { unlockAudio(); save(); $("setup").hidden = true; paint(); warmAll(); };
$("setBtn").onclick = () => { paintSetup(); $("setup").hidden = false; };

/* ---------- Main screen ---------- */
function paint() {
  $("spkBtn").textContent = autoSpeak ? ui.speakOn : ui.speakOff;
  $("tin").placeholder = ui.typePh;
  const nav = $("people"); nav.replaceChildren(); nav.className = "people" + (people.length === 1 ? " n1" : "");
  people.forEach((p, i) => {
    const b = document.createElement("button"); b.className = "pb"; b.id = `pb${i}`; b.style.background = COLORS[i];
    b.innerHTML = `<span></span><small></small>`; b.firstChild.textContent = `🎤 ${label(p, i)}`; b.lastChild.textContent = LANG[p.lang].name;
    b.onclick = () => { unlockAudio(); listenFor(i); };
    nav.append(b);
  });
  $("autoBtn").hidden = !AI.proxy; $("autoBtn").textContent = ui.auto;
  paintLog();
}
function paintLog() {
  const box = $("log"); box.replaceChildren();
  if (!log.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = ui.empty; box.append(e); return; }
  log.forEach((m, k) => {
    const el = document.createElement("div"); el.className = "msg" + (k === log.length - 1 ? " last" : ""); el.style.borderLeftColor = m.color;
    const who = document.createElement("div"); who.className = "who"; who.style.color = m.color; who.textContent = `${m.who} · ${LANG[m.lang].name}${m.detected ? " (" + ui.detected + ")" : ""}`;
    const orig = document.createElement("div"); orig.className = "orig"; orig.lang = m.lang; orig.textContent = m.text;
    el.append(who, orig);
    for (const t of m.out) {
      const d = document.createElement("div"); d.className = "tr";
      const l = document.createElement("span"); l.className = "l"; l.textContent = LANG[t.lang].name;
      const tt = document.createElement("span"); tt.className = "t"; tt.lang = t.lang; tt.textContent = t.text ?? "…";
      d.append(l, tt);
      if (t.rom) { const r = document.createElement("span"); r.className = "r"; r.textContent = t.rom; d.append(r); }
      el.append(d);
    }
    const again = document.createElement("button"); again.className = "mini"; again.textContent = "▶"; again.setAttribute("aria-label", "replay");
    again.onclick = () => { unlockAudio(); readOut(m); };
    el.append(again);
    box.append(el);
  });
  box.scrollTop = box.scrollHeight;
}
$("spkBtn").onclick = () => { autoSpeak = !autoSpeak; save(); paint(); };
$("clearBtn").onclick = () => { log = []; paintLog(); };
$("kbBtn").onclick = () => { $("typer").hidden = !$("typer").hidden; if (!$("typer").hidden) $("tin").focus(); };

/* ---------- Speak a result out loud, one language after another ---------- */
let readRun = 0;
function sayAndWait(text, lang) {
  return new Promise(async done => {
    const plan = voicePlan(lang, "f");
    if (!plan.id) {
      const u = new SpeechSynthesisUtterance(text); u.lang = LANG[lang].sr; if (plan.nv) u.voice = plan.nv; u.pitch = plan.pitch;
      u.onend = u.onerror = () => done(); speechSynthesis.speak(u); setTimeout(done, 2000 + text.length * 220); return;
    }
    try { await speakPiper(text, plan.id, plan.rate); } catch {}
    done();
  });
}
let reading = false;
async function readOut(m) {
  const my = ++readRun; speechSynthesis?.cancel?.(); try { playing?.stop(); } catch {}
  reading = true;
  try { for (const t of m.out) { if (my !== readRun || !t.text) return; await sayAndWait(t.text, t.lang); await new Promise(r => setTimeout(r, 250)); } }
  finally { if (my === readRun) reading = false; }
}
function stopReading() { readRun++; reading = false; try { speechSynthesis.cancel(); } catch {} try { playing?.stop(); } catch {} }

/* ---------- One utterance → every other language in the room ---------- */
async function addUtterance(text, lang, who, color, detected, ai) {
  text = text.trim(); if (!text) return;
  const targets = langsInRoom().filter(l => l !== lang);
  const m = { text, lang, who, color, detected, ai: !!ai, out: targets.map(l => ({ lang: l, text: ai?.tr?.[l] ? restore(protect(ai.tr[l]), l) : null, rom: ai?.rom?.[l] || "" })) };
  log.push(m); if (log.length > 60) log.shift(); paintLog(); st(ui.translating);
  // Anything the AI didn't give us is filled in by the free translator
  await Promise.all(m.out.map(async t => {
    if (t.text) { if (!t.rom) t.rom = romFor(t.text, t.lang); return; }
    try { const r = await translate(text, lang, t.lang); t.text = r.text; t.rom = r.rom; } catch { t.text = "⚠"; }
  }));
  paintLog(); st(ui.ready);
  if (autoSpeak) await readOut(m);
}

/* ---------- Per-person microphone ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recIdx = -1, recFinish = null;
function listenFor(i) {
  if (rec) { const was = recIdx; stopRec(); if (was === i) return; }
  if (handsFree) { handsFree = false; stopAuto(); paintAuto(); }
  if (Ears.busy()) { Ears.stopAI(); return; }
  stopReading();
  const p = people[i], btn = $(`pb${i}`);
  // The phone can't listen in this language (e.g. Georgian on iPhone): the AI listens instead
  if (Ears.needAI(p.lang)) {
    btn.classList.add("on"); st(`${label(p, i)}: ${ui.listening}`);
    Ears.aiOnce(p.lang, true, s => { if (s === "wait") st(`${label(p, i)}: ⏳`); }).then(({ alts }) => {
      btn.classList.remove("on");
      if (alts[0]) addUtterance(alts[0], p.lang, label(p, i), COLORS[i], false); else st("");
    });
    return;
  }
  let done = "", interim = "", finished = false, quiet = null, stopWanted = false, restarts = 0;
  recIdx = i; btn.classList.add("on"); st(`${label(p, i)}: ${ui.listening}`);
  const finish = () => {
    if (finished) return; finished = true; clearTimeout(quiet); const r = rec; rec = null; recIdx = -1; recFinish = null; try { r?.abort(); } catch {}
    btn.classList.remove("on"); const t = (done + " " + interim).trim();
    if (t) addUtterance(t, p.lang, label(p, i), COLORS[i], false); else st("");
  };
  recFinish = () => { stopWanted = true; try { rec?.stop(); } catch {} setTimeout(finish, 1500); };
  let spoke = false;   // wait up to 8 s for the first word, then stop 2 s after the last one
  const bump = () => { clearTimeout(quiet); quiet = setTimeout(() => recFinish?.(), spoke ? 2000 : 8000); };
  const begin = () => {
    const r = new SR(); rec = r; r.lang = LANG[p.lang].sr; r.interimResults = true; r.continuous = true;
    r.onresult = e => { let fin = "", tmp = ""; for (let k = e.resultIndex; k < e.results.length; k++) { const x = e.results[k]; if (x.isFinal) fin += x[0].transcript; else tmp += x[0].transcript; }
      if (fin || tmp.trim()) spoke = true;
      if (fin) done = (done + " " + fin).trim(); interim = tmp; st(`${label(p, i)}: ${(done + " " + interim).trim()}`); bump(); };
    r.onerror = e => { if (e.error === "no-speech" || e.error === "aborted") return; stopWanted = true;
      if (Ears.SERIOUS.includes(e.error)) { Ears.markAI(p.lang); st("🎙 AIで聞き取ります。もう一度押して話してください"); } else st(ui.micErr + " (" + e.error + ")"); };
    r.onend = () => { if (rec !== r) return; if (interim) { done = (done + " " + interim).trim(); interim = ""; } if (stopWanted || ++restarts > 40) finish(); else { try { begin(); } catch { finish(); } } };
    r.start();
  };
  bump(); setTimeout(() => recFinish?.(), 120000);
  try { begin(); } catch { finish(); }
}
function stopRec() { recFinish?.(); }

/* ---------- Typed text: language detected automatically ---------- */
async function detectAndTranslate(text) {
  let lang = null;
  try { const j = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=auto&tl=en&q=${encodeURIComponent(text)}`).then(r => r.json()); lang = pickLang(j[2]); } catch {}
  const i = people.findIndex(p => p.lang === lang);
  if (!lang) lang = people[0].lang;
  addUtterance(text, lang, i >= 0 ? label(people[i], i) : "?", i >= 0 ? COLORS[i] : "var(--muted)", true);
}
$("tsend").onclick = () => { unlockAudio(); const v = $("tin").value; $("tin").value = ""; if (v.trim()) detectAndTranslate(v); };
$("tin").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) $("tsend").click(); });

/* ---------- Hands-free mode (needs the AI): keeps listening; whoever speaks, in whatever language,
   is transcribed, recognised and translated for everyone by one AI call, using the conversation so far ---------- */
let handsFree = false, recording = null, queue = Promise.resolve();
async function openMic() {
  try { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } }); }
  catch { st(ui.micErr); return null; }
}
async function startAuto() {
  if (rec) stopRec();
  const stream = await openMic(); if (!stream) { handsFree = false; paintAuto(); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
  let chunks = [], heard = false, lastLoud = 0, started = 0, noise = 0.01;
  proc.onaudioprocess = e => {
    if (!handsFree) return;
    const d = e.inputBuffer.getChannelData(0);
    if (reading) { chunks = []; heard = false; return; }               // don't listen to our own read-aloud
    let sum = 0; for (let k = 0; k < d.length; k += 8) sum += d[k] * d[k]; const rms = Math.sqrt(sum / (d.length / 8));
    if (!heard) { noise = noise * 0.95 + rms * 0.05; chunks = chunks.slice(-5); }  // keep a little audio before speech starts
    chunks.push(new Float32Array(d));
    const loud = rms > Math.max(0.005, noise * 2.2);   // low floor so people further from the phone still count
    if (loud) { if (!heard) { heard = true; started = Date.now(); st(ui.listening); } lastLoud = Date.now(); }
    if (heard && (Date.now() - lastLoud > 1200 || Date.now() - started > 25000)) {
      const clip = chunks; chunks = []; heard = false;
      if (lastLoud - started > 350) queue = queue.then(() => sendClip(clip, ctx.sampleRate));   // ignore short clicks and bumps
    }
  };
  src.connect(proc); proc.connect(ctx.destination);
  recording = { stream, ctx, proc };
}
function stopAuto() {
  const R = recording; recording = null;
  try { R?.proc.disconnect(); R?.stream.getTracks().forEach(t => t.stop()); R?.ctx.close(); } catch {}
}
function paintAuto() { $("autoBtn").classList.toggle("on", handsFree); $("autoBtn").textContent = handsFree ? ui.autoOn : ui.auto; }
function toWav(chunks, rate) {
  const target = 16000, len = chunks.reduce((a, c) => a + c.length, 0), ratio = rate / target, n = Math.floor(len / ratio);
  const all = new Float32Array(len); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const buf = new DataView(new ArrayBuffer(44 + n * 2)), w = (p, s) => [...s].forEach((ch, k) => buf.setUint8(p + k, ch.charCodeAt(0)));
  w(0, "RIFF"); buf.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
  buf.setUint32(24, target, true); buf.setUint32(28, target * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); w(36, "data"); buf.setUint32(40, n * 2, true);
  // Make quiet (far-away) voices as loud as close ones before the AI hears them
  let peak = 0; for (let k = 0; k < len; k += 4) peak = Math.max(peak, Math.abs(all[k]));
  const boost = peak > 0 ? Math.min(12, 0.9 / peak) : 1;
  for (let k = 0; k < n; k++) { const v = Math.max(-1, Math.min(1, all[Math.floor(k * ratio)] * boost)); buf.setInt16(44 + k * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true); }
  let bin = ""; const u8 = new Uint8Array(buf.buffer); for (let k = 0; k < u8.length; k += 0x8000) bin += String.fromCharCode(...u8.subarray(k, k + 0x8000));
  return btoa(bin);
}
async function callAI(request, quality) {
  const r = await fetch(AI.proxy, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ request, quality }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "AI error");
  return j;
}
async function aiHear(wavB64) {
  const langs = langsInRoom();
  const recent = log.slice(-4).map(m => `${m.who} (${m.lang}): ${m.text}`).join("\n") || "(none yet)";
  const shop = GLOSS.map(g => `${g.en} = ${langs.map(l => `${l}: ${g[l]}`).join(", ")}`).join("\n");
  const prompt = `You are a live interpreter at a restaurant table in Tbilisi. People in the room speak: ${langs.map(l => `${l} (${LANG[l].name})`).join(", ")}.
1. Listen carefully and decide which of those languages is being spoken from the sounds themselves (Georgian and Russian sound very different from Japanese).
2. Transcribe the audio exactly, in that language and its own script (Georgian in Georgian letters, Russian in Cyrillic).
3. Translate it into every OTHER language in the room. Use the conversation so far to resolve words like "it", "that", "he". Natural, polite, spoken style.
4. Give a Latin-letter reading of each translation (romaji for Japanese, pinyin for Chinese, romanization for Georgian, Russian, Korean; empty for English).
Always use these shop words:
${shop}
Conversation so far:
${recent}
Answer only JSON: {"lang":"<code>","text":"<transcript>","tr":{"<code>":"<translation>"},"rom":{"<code>":"<reading>"}}. If there is no speech, answer {"lang":"","text":""}.`;
  const j = await callAI({ contents: [{ role: "user", parts: [{ inline_data: { mime_type: "audio/wav", data: wavB64 } }, { text: prompt }] }],
    generationConfig: { responseMimeType: "application/json", temperature: 0.2, thinkingConfig: { thinkingLevel: "minimal" } } });   // fast model: the bigger ones are usually busy on the free plan
  return JSON.parse((j.candidates?.[0]?.content?.parts || []).map(p => p.text).join("").replace(/^```json|```$/g, "") || "{}");
}
async function sendClip(clip, rate) {
  st(ui.translating);
  try {
    const out = await aiHear(toWav(clip, rate));
    if (!out.text || !LANG[out.lang]) { st(handsFree ? ui.autoOn : ""); return; }
    const i = people.findIndex(p => p.lang === out.lang);
    await addUtterance(out.text, out.lang, i >= 0 ? label(people[i], i) : "?", i >= 0 ? COLORS[i] : "var(--muted)", true, out);
  } catch (e) { st(ui.aiErr + " (" + (e.message || e) + ")"); }
}
$("autoBtn").onclick = () => { unlockAudio(); handsFree = !handsFree; paintAuto(); if (handsFree) startAuto(); else stopAuto(); };
window.__t4g = { aiHear, synth, voicePlan, loadVoice, langsInRoom, get log() { return log; } };   // for testing

/* ---------- Voices for every language in the room ---------- */
async function warmAll() {
  for (const lang of langsInRoom()) {
    const id = voicePlan(lang, "f").id; if (!id || sessions[id]) continue;
    try { await loadVoice(id, p => st(`🔊 ${LANG[lang].name} ${Math.round(p * 100)}%`)); await synth("a", id); } catch { st(`⚠ ${LANG[lang].name}`); return; }
  }
  st(ui.ready);
}

document.addEventListener("pointerdown", unlockAudio, { passive: true });
try { navigator.wakeLock?.request("screen").catch(() => {}); } catch {}
paint();
let first = true; try { first = !localStorage.getItem("t4g"); } catch {}
if (first) { paintSetup(); $("setup").hidden = false; } else warmAll();
</script>
<script src="nav.js"></script>
