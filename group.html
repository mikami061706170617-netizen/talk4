:root{

  --font:"Noto Sans JP","Noto Sans Georgian","Noto Sans",system-ui,sans-serif;
  --display:Oswald,"Noto Sans JP","Noto Sans Georgian",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:18px;margin-right:auto;display:flex;gap:10px;align-items:baseline}
.brand b{color:var(--gold)}
.brand a{font-family:var(--font);font-weight:400;font-size:13px;color:var(--muted)}
.tool{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.st{font-size:12px;color:var(--muted);min-height:16px;text-align:center}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:6px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:16px;line-height:1.7;max-width:420px}
.msg{background:var(--panel);border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg .who{font-size:12px;letter-spacing:.06em;font-weight:700}
.msg .orig{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.msg .tr{display:flex;flex-direction:column;gap:1px;border-top:1px dashed var(--line);padding-top:6px}
.msg .tr .l{font-size:11px;color:var(--muted);letter-spacing:.06em}
.msg .tr .t{font-size:clamp(18px,4.6vw,26px);font-weight:700;overflow-wrap:anywhere}

.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-block:8px}
.people.n1{grid-template-columns:minmax(0,1fr)}
.pb{border:none;border-radius:16px;padding:14px 10px;font-weight:700;font-size:17px;color:#16120a;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px}
.pb small{font-weight:400;font-size:12px;opacity:.85}
.pb.on{animation:pulse 1s infinite;outline:3px solid #fff}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.pb.on,.auto.on{animation:none}}
.auto{border:2px solid var(--gold);background:#211c12;color:var(--gold);border-radius:16px;padding:12px;font-weight:700;font-size:16px;width:100%}
.auto.on{animation:pulse 1s infinite}

.typer button{border:none;background:var(--gold);color:#1a1307;border-radius:12px;padding:0 16px;font-weight:700}
.setup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.setup .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
.setup h2{margin:0;font-size:18px}
.setup .row{display:flex;gap:8px;align-items:center}
.setup .dot{width:14px;height:14px;border-radius:50%;flex:none}

.setup input{flex:1}
.setup .x{border:1px solid var(--line);background:none;border-radius:10px;width:40px;height:40px}

.hint{font-size:13px;color:var(--muted);line-height:1.6}

    ws.send(JSON.stringify({ realtimeInput: { audio: { data: btoa(bin), mimeType: "audio/pcm;rate=16000" } } }));
  }
  band.connect(proc); proc.connect(ctx.destination);
  liveConnect(passP);
  // Rescue: in a noisy room the fast AI sometimes never notices the sentence ended and stays silent.
  // 1.5 s after the voice stops with no answer: tell it the sentence is over. Still nothing after 4 s:
  // the precise AI listens to the recording and translates it the normal way.
  clearInterval(Live.rescueT);
  Live.rescueT = setInterval(() => {
    const v = Live.lastVoice, ws = Live.ws; if (!Live.on || !v || Live.gotAt > v || Live.rescued === v) return;
    const quiet = performance.now() - v;
    if (quiet > 1500 && !Live.flushed && ws?.readyState === 1) { Live.flushed = true; try { ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } })); } catch {} }
    if (quiet > 4000) {
      Live.rescued = v; const clip = Live.clip, enough = Live.chunks >= 5; Live.clip = []; Live.chunks = 0;
      if (!enough || clip.reduce((a, b) => a + b.length, 0) / ctx.sampleRate < 0.6) return;
      st(ui.translating);
      aiHear(toWav(clip, ctx.sampleRate)).then(async out => {
        if (!Live.on || !out?.text || !LANG[out.lang] || Live.gotAt > v) { if (Live.on) st(ui.listening); return; }
        const i = people.findIndex(p => p.lang === out.lang);
        Live.mute = true;
        try { await addUtterance(out.text, out.lang, (i >= 0 ? label(people[i], i) : "?") + " ✓", i >= 0 ? COLORS[i] : "var(--muted)", true, out); }
        finally { Live.mute = false; Live.lastVoice = 0; if (Live.on) st(ui.listening); }
      }).catch(() => { if (Live.on) st(ui.listening); });
    }
  }, 300);
};
Live.stop = () => {
  Live.on = false; paintLive(); clearInterval(Live.rescueT); $("liveMeter").hidden = true;
  try { Live.ws?.close(); } catch {} Live.ws = null;
  try { Live.proc?.disconnect(); Live.stream?.getTracks().forEach(t => t.stop()); Live.ctx?.close(); } catch {}
  Live.ctx = null; Live.cur = null; st("");
  audioMode("auto");   // leaving fast mode: normal loud sound again
};
$("liveBtn").onclick = () => { unlockAudio(); if (Live.on) Live.stop(); else Live.start(); };
$("liveBtn").hidden = !AI.proxy; paintLive(); paintLiveVoice();
try { Live.barge = localStorage.getItem("t4-barge") === "1"; } catch {}
function paintBarge() { const b = $("bargeBtn"); b.hidden = !AI.proxy;
  b.textContent = (uiLang === "ja" ? "🗣 読み上げ中も話せる: " : "🗣 Talk over the translation: ") + (Live.barge ? "ON" : "OFF");
  b.style.borderColor = Live.barge ? "var(--gold)" : ""; b.style.color = Live.barge ? "var(--gold)" : ""; }
$("bargeBtn").onclick = () => { Live.barge = !Live.barge; try { localStorage.setItem("t4-barge", Live.barge ? "1" : "0"); } catch {} paintBarge(); };
paintBarge();
window.__t4g = { aiHear, synth, voicePlan, loadVoice, langsInRoom, get log() { return log; } };   // for testing

/* ---------- Voices for every language in the room ---------- */
async function warmAll() {
  for (const lang of langsInRoom()) {
    const id = voicePlan(lang, "f").id; if (!id || sessions[id]) continue;
    try { await loadVoice(id, p => st(`🔊 ${LANG[lang].name} ${Math.round(p * 100)}%`)); await synth("a", id); } catch { st(`⚠ ${LANG[lang].name}`); return; }
  }
  st(ui.ready);
}

document.addEventListener("pointerdown", unlockAudio, { passive: true });
try { navigator.wakeLock?.request("screen").catch(() => {}); } catch {}
paint();
let first = true; try { first = !localStorage.getItem("t4g"); } catch {}
if (first) { paintSetup(); $("setup").hidden = false; } else warmAll();
</script>
