:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}

.brand b{color:var(--gold)}
.brand a{font-family:var(--font);font-weight:400;font-size:13px;color:var(--muted)}
.tool{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-family:var(--display);font-size:clamp(28px,6vw,46px);line-height:1.05;text-transform:uppercase}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:#d6cfc2;line-height:1.65;font-size:16px;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}

.switch .big{font-family:var(--display);font-size:clamp(34px,8vw,70px);color:var(--gold);text-transform:uppercase}
